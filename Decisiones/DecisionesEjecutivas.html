<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketGeo · Gestión de Recolección de Residuos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ============ VARIABLES / TEMA ============ */
:root{
  --bg:#edf1ee; --surface:#ffffff; --surface-2:#f5f8f6; --surface-3:#eaf0ec;
  --border:#d8e0dc; --border-strong:#bcc9c2;
  --text:#182420; --text-2:#5c6b64; --text-3:#8d9b93;
  --primary:#0f6e5c; --primary-600:#0b584a; --primary-soft:#e0f0eb; --primary-text:#0b584a;
  --accent:#3aa384; --focus:rgba(15,110,92,.28);
  --ok:#2f9e63; --warn:#d9981e; --err:#d9483b; --info:#2f7fd1; --purp:#7c5cd6;
  --grad1:#0f6e5c; --grad2:#3aa384;
  --shadow:0 2px 10px rgba(16,34,28,.08); --shadow-lg:0 14px 34px rgba(16,34,28,.16);
  --r:14px;
}
[data-theme="dark"]{
  --bg:#0d1310; --surface:#151f1b; --surface-2:#1a2621; --surface-3:#20302a;
  --border:#2a3a33; --border-strong:#3d5148;
  --text:#e7eeea; --text-2:#a3b3aa; --text-3:#71857b;
  --primary:#3ecfa8; --primary-600:#2fb894; --primary-soft:rgba(62,207,168,.13); --primary-text:#57dcb8;
  --accent:#3ecfa8;
  --grad1:#12463b; --grad2:#1f6a58;
  --shadow:0 2px 12px rgba(0,0,0,.45); --shadow-lg:0 16px 40px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
h1,h2,h3,.sb-brand,.tb-app,.kpi-val,.modal-t,.card-t{font-family:Sora,Inter,sans-serif}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
svg.ic{flex:none;vertical-align:middle}

/* ============ LAYOUT ============ */
#app{display:flex;height:100vh}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
#content{flex:1;overflow-y:auto;padding:20px 24px 40px}

/* ============ SIDEBAR ============ */
.sidebar{width:248px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .22s,transform .22s;z-index:60;overflow:hidden}
.sb-brand{display:flex;gap:11px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sb-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.sb-name{font-weight:800;font-size:16px;letter-spacing:.4px}
.sb-name span{color:var(--primary)}
.sb-sub{font-size:10.5px;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase}
.sb-scroll{flex:1;overflow-y:auto;padding:10px 10px 14px}
.sb-glabel{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3);padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;margin:2px 0;border:1px solid transparent;border-radius:10px;background:none;color:var(--text-2);font:500 13.5px Inter;cursor:pointer;text-align:left;transition:.16s;white-space:nowrap}
.sb-item:hover{background:var(--surface-2);color:var(--text);border-color:var(--border);transform:translateX(3px)}
.sb-item.active{background:var(--primary-soft);color:var(--primary-text);border-color:color-mix(in srgb,var(--primary) 35%,transparent);box-shadow:inset 3px 0 0 var(--primary)}
.sb-item.active svg{color:var(--primary)}
.sb-foot{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}
body.sb-collapsed .sidebar{width:66px}
body.sb-collapsed .sb-label,body.sb-collapsed .sb-name,body.sb-collapsed .sb-sub,body.sb-collapsed .sb-glabel,body.sb-collapsed .sb-foot{display:none}
body.sb-collapsed .sb-item{justify-content:center;padding:11px}
@media (max-width:1023px){
  .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-105%);box-shadow:var(--shadow-lg)}
  body.sb-open .sidebar{transform:none}
  body.sb-collapsed .sidebar{width:248px}
  body.sb-collapsed .sb-label,body.sb-collapsed .sb-name,body.sb-collapsed .sb-sub,body.sb-collapsed .sb-glabel{display:block}
}

/* ============ TOPBAR / BREADCRUMB ============ */
#topbar{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.tb-brand{display:flex;align-items:center;gap:10px;min-width:0}
.tb-app{font-weight:800;font-size:17px;letter-spacing:.3px}
.tb-app span{color:var(--primary)}
.tb-comp{font-size:11px;color:var(--text-3);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-date{display:flex;align-items:center;gap:8px;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);color:var(--primary-text);padding:7px 13px;border-radius:11px;font-weight:600;font-size:12.5px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s}
.icon-btn:hover{color:var(--primary-text);border-color:var(--primary);background:var(--primary-soft);transform:translateY(-2px);box-shadow:var(--shadow)}
.tb-search{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:0 12px;height:36px;color:var(--text-3)}
.tb-search input{border:none;outline:none;background:none;font:500 13px Inter;color:var(--text);width:190px}
.gs-res{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;display:none;z-index:80;max-height:320px;overflow-y:auto}
.gs-res.show{display:block}
.gs-item{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
.gs-item:hover{background:var(--primary-soft)}
.gs-item .gs-k{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px}
.tb-map{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--purp),var(--info));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px}
#breadcrumb{display:flex;align-items:center;gap:7px;padding:9px 24px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-3)}
#breadcrumb b{color:var(--primary-text);font-weight:600}
#breadcrumb .cr-sep{opacity:.5}

/* ============ COMPONENTES ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-t{font-size:15px;font-weight:700}
.card-s{font-size:11.5px;color:var(--text-3)}
.card-b{padding:16px}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-title{font-size:21px;font-weight:800}
.page-sub{font-size:12.5px;color:var(--text-3)}
.spacer{flex:1}
.muted{color:var(--text-3)} .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 13px Inter;cursor:pointer;transition:.16s;box-shadow:var(--shadow)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--primary-soft);color:var(--primary-text);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.btn.danger{background:color-mix(in srgb,var(--err) 12%,var(--surface));color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.ghost{background:transparent;box-shadow:none}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font:600 11px Inter;letter-spacing:.2px;border:1px solid transparent;white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok);border-color:color-mix(in srgb,var(--ok) 38%,transparent)}
.badge.warn{background:color-mix(in srgb,var(--warn) 15%,var(--surface));color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.badge.err{background:color-mix(in srgb,var(--err) 13%,var(--surface));color:var(--err);border-color:color-mix(in srgb,var(--err) 38%,transparent)}
.badge.info{background:color-mix(in srgb,var(--info) 13%,var(--surface));color:var(--info);border-color:color-mix(in srgb,var(--info) 38%,transparent)}
.badge.purp{background:color-mix(in srgb,var(--purp) 13%,var(--surface));color:var(--purp);border-color:color-mix(in srgb,var(--purp) 38%,transparent)}
.badge.mut{background:var(--surface-3);color:var(--text-2);border-color:var(--border)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);font:600 11.5px Inter;color:var(--text-2)}
.chip.qr{font-family:ui-monospace,monospace;color:var(--primary-text);border-color:color-mix(in srgb,var(--primary) 35%,transparent);background:var(--primary-soft)}

.inp,.sel{width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);font:500 13px Inter;outline:none;transition:.15s;box-shadow:inset 0 1px 3px rgba(0,0,0,.04)}
.inp:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--focus)}
.sel{cursor:pointer;appearance:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font:600 11.5px Inter;color:var(--text-2);letter-spacing:.2px}

.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:8px;border:none;background:none;color:var(--text-2);font:600 12px Inter;cursor:pointer;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--surface);color:var(--primary-text);box-shadow:var(--shadow)}

/* ============ TOOLTIP ============ */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:#101d18;color:#fff;padding:7px 11px;border-radius:9px;font:500 11.5px Inter;width:max-content;max-width:280px;z-index:999;box-shadow:0 8px 22px rgba(0,0,0,.35);pointer-events:none;line-height:1.4;border:1px solid rgba(255,255,255,.14)}

/* ============ KPI ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.kpi-grid{grid-template-columns:1fr}}
.kpi{display:flex;align-items:center;gap:15px;padding:18px;border-radius:var(--r);border:1.5px solid var(--k);background:color-mix(in srgb,var(--k) 13%,var(--surface));box-shadow:var(--shadow);cursor:default;transition:transform .2s,box-shadow .2s,background .2s}
.kpi:hover{background:var(--k);transform:translateY(-4px) scale(1.015);box-shadow:0 18px 34px color-mix(in srgb,var(--k) 45%,rgba(0,0,0,.25))}
.kpi:hover .kpi-ico{color:#fff;background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}
.kpi-ico{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--k);background:color-mix(in srgb,var(--k) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--k) 45%,transparent);flex:none;transition:.2s}
.kpi-val{font-size:29px;font-weight:800;line-height:1;color:var(--text)}
.kpi-t{font:700 12px Inter;color:var(--text-2);margin-top:4px;letter-spacing:.2px}
.kpi-sub{font-size:10.5px;color:var(--text-3);margin-top:3px}
.k-green{--k:#2f9e63}.k-blue{--k:#2f7fd1}.k-yellow{--k:#d9981e}.k-orange{--k:#e07b2a}.k-purple{--k:#7c5cd6}.k-red{--k:#d9483b}

/* ============ TABLAS ============ */
.tblwrap{border:1px solid var(--border);border-radius:var(--r);overflow:auto;background:var(--surface);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{position:sticky;top:0;z-index:5;text-align:left;padding:11px 13px;font:600 11.5px Inter;letter-spacing:.4px;color:#fff;background-image:linear-gradient(100deg,var(--grad1),var(--grad2),var(--grad1));background-size:230% 100%;animation:thFlow 16s ease infinite;white-space:nowrap;cursor:pointer;user-select:none}
@keyframes thFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.tbl th .th-arrow{font-size:9px;opacity:.85;margin-left:4px}
.tbl td{padding:10px 13px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle}
.tbl tbody tr{transition:background .13s}
.tbl tbody tr:hover{background:var(--primary-soft)}
.tbl .td-act{display:flex;gap:6px}
.mini-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.mini-btn:hover{color:var(--primary-text);border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.pag{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:11px 14px;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.pag-btn{min-width:30px;height:30px;padding:0 8px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:600 12px Inter;cursor:pointer;transition:.14s}
.pag-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary-text)}
.pag-btn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pag-btn:disabled{opacity:.4;cursor:default}
.empty{padding:34px;text-align:center;color:var(--text-3);font-size:13px}

/* ============ DASHBOARD ============ */
.dash-grid{display:grid;grid-template-columns:2.1fr 1fr;gap:16px;margin-bottom:18px}
@media(max-width:1150px){.dash-grid{grid-template-columns:1fr}}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.map-box{width:100%;border-radius:0 0 var(--r) var(--r);z-index:1}
.map-box.lg{height:430px}
.map-box.md{height:360px}
.map-box.sm{height:250px}
.map-tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.layer-chk{display:inline-flex;align-items:center;gap:6px;font:600 11px Inter;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 9px;cursor:pointer;user-select:none;transition:.14s}
.layer-chk:hover{border-color:var(--primary);color:var(--primary-text)}
.layer-chk.on{background:var(--primary-soft);color:var(--primary-text);border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
.legend{display:flex;gap:13px;flex-wrap:wrap;padding:10px 16px;font-size:11px;color:var(--text-2);border-top:1px solid var(--border)}
.lg-dot{width:11px;height:11px;border-radius:4px;display:inline-block;border:1.5px solid rgba(0,0,0,.25);vertical-align:-1px;margin-right:5px}
.act-wrap{max-height:478px;overflow-y:auto;padding:8px}
.act-item{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;border-radius:11px;border:1px solid transparent;cursor:pointer;transition:.15s}
.act-item:hover{background:var(--surface-2);border-color:var(--border);transform:translateX(3px)}
.act-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;border:1.5px solid}
.act-ico.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.act-ico.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,transparent);background:color-mix(in srgb,var(--err) 11%,var(--surface))}
.act-ico.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent);background:color-mix(in srgb,var(--info) 11%,var(--surface))}
.act-ico.purp{color:var(--purp);border-color:color-mix(in srgb,var(--purp) 45%,transparent);background:color-mix(in srgb,var(--purp) 11%,var(--surface))}
.act-t{font:600 12.5px Inter}
.act-s{font-size:11px;color:var(--text-3);margin-top:2px}
.act-time{font-size:10.5px;color:var(--text-3);white-space:nowrap;margin-left:auto}
.rango{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rango input[type=date]{padding:7px 10px;border-radius:9px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);font:500 12px Inter;outline:none}
.rango input[type=date]:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--focus)}
.motivo-row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px dashed var(--border)}
.motivo-row:last-child{border-bottom:none}
.motivo-bar{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));min-width:40px}
canvas{max-width:100%}

/* ============ MARCADORES / POPUPS ============ */
.leaflet-container{background:var(--surface-3);font:12px Inter}
.mk{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:#fff;border:2px solid var(--primary);color:var(--primary);box-shadow:0 3px 10px rgba(0,0,0,.3);font:700 13px Sora}
.mk-truck{border-color:#2563eb;color:#2563eb}
.mk-bin.ok{border-color:#059669;color:#059669}
.mk-bin.bad{border-color:#dc2626;color:#dc2626}
.mk-bin.warn{border-color:#d97706;color:#d97706}
.mk-bin.mut{border-color:#64748b;color:#64748b}
.mk-pin{border-color:#0f6e5c;background:#0f6e5c;color:#fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.mk-pin svg{transform:rotate(45deg)}
.mk-center{border-color:#7c3aed;color:#7c3aed;width:32px;height:32px;border-radius:11px}
.mk-ubi{border-color:#0891b2;color:#0891b2}
.mk-alert{border-color:#dc2626;background:#dc2626;color:#fff;animation:mkPulse 1.6s infinite}
@keyframes mkPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}55%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
.mk-num{width:30px;height:30px;border-radius:50%;background:#0f6e5c;border:2.5px solid #fff;color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.4)}
.leaflet-popup-content-wrapper{border-radius:13px;background:var(--surface);color:var(--text);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg)}
.leaflet-popup-content{margin:12px 15px;font:12.5px Inter;line-height:1.5}
.leaflet-popup-tip{background:var(--surface);border:1px solid var(--border-strong)}
.pp-t{font:700 13.5px Sora;margin-bottom:2px}
.pp-s{color:var(--text-3);font-size:11px;margin-bottom:7px}
.pp-row{display:flex;gap:7px;align-items:center;margin:2.5px 0;color:var(--text-2);font-size:12px}
.pp-link{color:var(--primary);font-weight:700;cursor:pointer;text-decoration:underline;font-size:12px;margin-top:7px;display:inline-block}

/* ============ MODALES ============ */
.modal-ov{position:fixed;inset:0;background:rgba(10,20,16,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:22px;z-index:200;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:18px;box-shadow:var(--shadow-lg);width:min(720px,96vw);max-height:92vh;display:flex;flex-direction:column;animation:popIn .22s}
.modal.wide{width:min(920px,96vw)}
.modal.xl{width:min(1150px,97vw)}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(12px)}}
.modal-h{display:flex;align-items:center;gap:13px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-ico{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary-text);display:flex;align-items:center;justify-content:center;border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);flex:none}
.modal-t{font-size:16.5px;font-weight:800;line-height:1.2}
.modal-s{font-size:11.5px;color:var(--text-3);margin-top:2px}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}

/* ============ FORMULARIOS / INFO ============ */
.fsec{margin-bottom:16px}
.fsec-t{font:700 11.5px Inter;color:var(--primary-text);text-transform:uppercase;letter-spacing:1px;margin-bottom:9px;padding-bottom:5px;border-bottom:1px dashed var(--border)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px}
.kv-it{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:9px 12px}
.kv-k{font:600 10.5px Inter;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px}
.kv-v{font:600 13px Inter;color:var(--text);word-break:break-word}
.qr-visual{color:#0b1f19;background:#fff;padding:7px;border-radius:11px;border:1.5px solid var(--border-strong);display:inline-block}
.prog{height:11px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border);overflow:hidden;display:flex}
.prog i{height:100%;display:block}
.thumb{display:flex;flex-direction:column;align-items:center;gap:5px;width:110px;padding:10px 6px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--text-3);font-size:9.5px;text-align:center;cursor:pointer;transition:.15s}
.thumb:hover{border-color:var(--primary);color:var(--primary-text);transform:translateY(-3px);box-shadow:var(--shadow)}
.thumb .th-ico{width:52px;height:40px;border-radius:8px;background:linear-gradient(135deg,var(--surface-3),var(--border));display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--surface);border:1px solid var(--ok);border-left:4px solid var(--ok);color:var(--text);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-lg);font:600 13px Inter;display:flex;gap:9px;align-items:center;z-index:400;animation:toastIn .25s}
.toast.err{border-color:var(--err)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px}
.ruta-layout{display:grid;grid-template-columns:305px 1fr;gap:16px}
@media(max-width:860px){.ruta-layout{grid-template-columns:1fr}}
.ruta-cli{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--border);margin-bottom:6px;cursor:pointer;transition:.14s;background:var(--surface)}
.ruta-cli:hover{border-color:var(--primary);transform:translateX(3px);box-shadow:var(--shadow)}
.ruta-num{width:27px;height:27px;border-radius:50%;background:var(--primary);color:#fff;font:700 12px Sora;display:flex;align-items:center;justify-content:center;flex:none}
.ruta-cli.bad .ruta-num{background:var(--err)}
.ruta-cli.pend .ruta-num{background:var(--warn)}
.gis-layout{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media(max-width:900px){.gis-layout{grid-template-columns:1fr}}
.gis-list{max-height:560px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.check-list{display:flex;flex-direction:column;gap:8px}
.check-it{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2)}

/* ============ CONTROL DE MAPA BASE (combo en cada mapa) ============ */
.basemap-ctl{background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow);padding:4px 6px;transition:.16s;z-index:800}
.basemap-ctl:hover{border-color:var(--primary)}
.basemap-ctl select{border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font:600 11.5px Inter;padding:4px 8px;outline:none;cursor:pointer;max-width:185px}
.basemap-ctl select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--focus)}

/* ============ VISOR DE IMÁGENES (GALERÍA / LIGHTBOX) ============ */
.imgv-stage{position:relative;background:#0b1310;border-radius:12px;overflow:hidden;height:min(58vh,520px);display:flex;align-items:center;justify-content:center;user-select:none;cursor:zoom-in}
.imgv-stage.zoomed{cursor:grab}
.imgv-stage.dragging{cursor:grabbing}
.imgv-stage img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .18s ease;will-change:transform;pointer-events:none}
.imgv-stage.zoomed img{transition:none}
.imgv-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,20,16,.72);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;backdrop-filter:blur(4px)}
.imgv-nav:hover{background:var(--primary);border-color:var(--primary)}
.imgv-nav.prev{left:14px}
.imgv-nav.next{right:14px}
.imgv-nav[disabled]{opacity:.3;cursor:default;pointer-events:none}
.imgv-badge,.imgv-zoom-badge{position:absolute;z-index:10;background:rgba(10,20,16,.72);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:5px 11px;font:600 11.5px Inter;backdrop-filter:blur(4px)}
.imgv-badge{top:12px;left:14px}
.imgv-zoom-badge{bottom:12px;right:14px}
.imgv-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#9fb4aa;padding:30px;text-align:center}
.imgv-ph .ph-frame{width:110px;height:110px;border-radius:16px;border:2px dashed #3d5148;display:flex;align-items:center;justify-content:center;color:#5c6b64;background:rgba(255,255,255,.02)}
.imgv-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.imgv-name{font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:6px 11px;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zm-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.14s;font:700 15px Inter}
.zm-btn:hover{color:var(--primary-text);border-color:var(--primary);background:var(--primary-soft)}
.imgv-count{margin-left:auto;font:700 12px Inter;color:var(--text-2)}
.imgv-thumbs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.imgv-th{flex:none;width:74px;height:56px;border-radius:9px;border:2px solid var(--border);overflow:hidden;cursor:pointer;position:relative;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:.15s}
.imgv-th:hover{border-color:var(--primary);transform:translateY(-2px)}
.imgv-th.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--focus)}
.imgv-th img{width:100%;height:100%;object-fit:cover}
.imgv-th .th-idx{position:absolute;bottom:2px;right:4px;font:700 9.5px Inter;color:#fff;background:rgba(0,0,0,.55);border-radius:5px;padding:1px 5px}
.tb-logo{height:34px;max-width:150px;object-fit:contain;border-radius:8px;border:1px solid var(--border);background:var(--surface);padding:2px 6px}
</style>

/* ── Formato de fechas / utilidades ── */
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const p2=n=>String(n).padStart(2,'0');
function toDate(s){ return s? new Date(s) : null; }
function isNullDate(s){ return !s || String(s).startsWith('0001-01-01'); }
function fmtDate(s){ const d=toDate(s); if(!d||isNaN(d)||isNullDate(s)) return '—'; return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear(); }
function fmtTime(s){ const d=toDate(s); if(!d||isNaN(d)) return '—'; return p2(d.getHours())+':'+p2(d.getMinutes()); }
function fmtDT(s){ return isNullDate(s)?'—':fmtDate(s)+' · '+fmtTime(s); }
function sameDay(a,b){ return a && b && a.slice(0,10)===b.slice(0,10); }
function inRange(s){ const k=s?s.slice(0,10):''; return k>=S.range.ini && k<=S.range.fin; }
function fmtDur(a,b){ if(isNullDate(a)||isNullDate(b)) return '—';
  let m=Math.round((toDate(b)-toDate(a))/60000); if(m<0)m=0;
  return m>=60? Math.floor(m/60)+' h '+p2(m%60)+' min' : m+' min'; }
function dist(a,b){ return Math.hypot(a.Latitud-b.Latitud, a.Longitud-b.Longitud); }

/* ── Relaciones derivadas (respetan el modelo, no lo alteran) ── */
const contClienteMap = {};   // ContenedorId -> ClienteId (derivado de la visita más reciente)
D.ClientesVisitas.forEach(v => v.ContenedoresVisitas.forEach(cv => {
  const prev = contClienteMap[cv.ContenedorId];
  if(prev===undefined || v.FechaHoraInicio > prev.fecha) contClienteMap[cv.ContenedorId] = {clienteId:v.ClienteId, fecha:v.FechaHoraInicio};
}));
function clienteDeContenedor(id){
  const m = contClienteMap[id];
  if(m) return byId(D.Clientes, m.clienteId);
  const c = byId(D.Contenedores, id);
  if(!c) return null;
  let best=null, bd=1e9;
  D.Clientes.forEach(cl=>{ const dd=dist(cl,c); if(dd<bd){bd=dd;best=cl;} });
  return bd<0.004 ? best : null;
}
function contsDeCliente(cid){ return D.Contenedores.filter(c => (contClienteMap[c.ContenedorId]?contClienteMap[c.ContenedorId].clienteId:null)===cid || (clienteDeContenedor(c.Id)||{}).Id===cid); }
function ubicDeContenedor(c){ return D.UbicacionesContenedores.find(u => dist(u,c)<0.0025) || null; }
function tipoContFull(tc){ return { ...tc, carga:byId(D.TiposCarga,tc.TipoCargaId), cap:byId(D.CapacidadesTipoContenedor,tc.CapacidadTipoContenedorId) }; }
function visitasDeDespacho(did){ return D.ClientesVisitas.filter(v=>v.DispatchId===did); }
function despachosHoy(){ return D.Despachos.filter(d=>sameDay(d.Fecha,FECHA_REF)); }
function estadoVisita(v){ if(!v) return 'pend'; if(v.NoServicio) return 'noserv'; return isNullDate(v.FechaHoraFin)?'pend':'ok'; }
function visitasRango(){ return D.ClientesVisitas.filter(v=>inRange(v.FechaHoraInicio)); }
function pendientesDeHoy(){ const out=[];
  despachosHoy().forEach(d=>d.ClientesRuta.forEach(cid=>{
    const v=D.ClientesVisitas.find(x=>x.DispatchId===d.Id && x.ClienteId===cid);
    if(!v) out.push({clienteId:cid, dispatch:d});
  })); return out; }
function estadoClienteHoy(cl){
  const v = cl.ClienteVisitaId ? byId(D.ClientesVisitas, cl.ClienteVisitaId) : null;
  if(v && sameDay(v.FechaHoraInicio,FECHA_REF)) return estadoVisita(v);
  if(despachosHoy().some(d=>d.ClientesRuta.includes(cl.Id))) return 'pend';
  return 'nuevo';
}
function unidadEstado(u){ return despachosHoy().some(d=>d.UnidadId===u.Id) ? 'servicio':'disp'; }
function iconoResiduo(nombre){ const n=String(nombre||'').toUpperCase();
  if(n.includes('ORG')) return 'leaf'; if(n.includes('INORG')) return 'recycle'; if(n.includes('MIX')) return 'shuffle';
  if(n.includes('PELIG')) return 'hazard'; if(n.includes('ELECT')) return 'cpu'; return 'dot'; }

/* ── QR visual decorativo (representación) ── */
function qrVisual(txt, px=96){
  let h=7; for(const ch of String(txt)){ h=(h*31+ch.charCodeAt(0))>>>0; }
  const rnd=()=>{ h=(h*1103515245+12345)>>>0; return (h>>>16)/65536; };
  const n=21, cell=px/n; let r='';
  const finder=(x,y)=>((x<7&&y<7))||(x>=n-7&&y<7)||(x<7&&y>=n-7);
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    let on;
    if(finder(x,y)){ const fx=x<n-7?x:x-(n-7), fy=y<7?y:y-7;
      on=(fx===0||fx===6||fy===0||fy===6)||(fx>=2&&fx<=4&&fy>=2&&fy<=4);
    } else on = rnd()>0.52;
    if(on) r+='<rect x="'+(x*cell).toFixed(1)+'" y="'+(y*cell).toFixed(1)+'" width="'+cell.toFixed(1)+'" height="'+cell.toFixed(1)+'"/>';
  }
  return '<svg class="qr-visual" width="'+px+'" height="'+px+'" viewBox="0 0 '+px+' '+px+'" fill="currentColor" xmlns="http://www.w3.org/2000/svg">'+r+'</svg>';
}

  ov.remove();
}

/* ══════════════════════════ VISOR DE IMÁGENES (GALERÍA / LIGHTBOX) ══════════════════════════ */
function openImageViewer(urls, opts={}){
  const list=(Array.isArray(urls)?urls:[urls]).filter(Boolean).map(String);
  if(!list.length){ toast('Este registro no tiene imágenes registradas.','err'); return; }
  let idx=Math.min(Math.max(opts.startAt||0,0), list.length-1), zoom=1, px=0, py=0, drag=null;

  const ov=openModal({
    title: opts.title||'Visor de imágenes',
    sub: (opts.sub? opts.sub+' · ':'')+list.length+(list.length>1?' imágenes · ':' imagen · ')+'rueda del mouse = zoom · doble clic = ampliar · ← → = navegar',
    icon:'image', size:'xl', body:'',
    footer:'<button class="btn ghost" data-act="close-modal">Cerrar visor</button>'});

  const root=ov.querySelector('.modal-b');
  root.innerHTML=
   '<div class="imgv-stage" id="imgv-stage">'+
     '<div class="imgv-badge" id="imgv-badge"></div>'+
     '<button class="imgv-nav prev" id="imgv-prev" data-tip="Imagen anterior">'+I('chevleft',20)+'</button>'+
     '<img id="imgv-img" alt="Evidencia fotográfica">'+
     '<button class="imgv-nav next" id="imgv-next" data-tip="Imagen siguiente">'+I('chevright',20)+'</button>'+
     '<div class="imgv-zoom-badge" id="imgv-zb">100%</div>'+
   '</div>'+
   '<div class="imgv-toolbar">'+
     '<span class="imgv-name" id="imgv-name"></span>'+
     '<button class="zm-btn" id="zm-out" data-tip="Alejar">−</button>'+
     '<button class="zm-btn" id="zm-reset" data-tip="Restablecer zoom">'+I('refresh',14)+'</button>'+
     '<button class="zm-btn" id="zm-in" data-tip="Acercar">+</button>'+
     '<button class="btn sm soft" id="imgv-open-btn" data-tip="Abrir en pestaña nueva">'+I('eye',13)+' Abrir</button>'+
     '<a class="btn sm soft" id="imgv-dl" download data-tip="Descargar imagen">'+I('download',13)+' Descargar</a>'+
     '<span class="imgv-count" id="imgv-count"></span>'+
   '</div>'+
   (list.length>1?'<div class="imgv-thumbs" id="imgv-thumbs"></div>':'<div style="height:6px"></div>');

  const stage=root.querySelector('#imgv-stage'), img=root.querySelector('#imgv-img'),
        badge=root.querySelector('#imgv-badge'), prev=root.querySelector('#imgv-prev'),
        next=root.querySelector('#imgv-next'), zb=root.querySelector('#imgv-zb'),
        nameEl=root.querySelector('#imgv-name'), count=root.querySelector('#imgv-count'),
        openBtn=root.querySelector('#imgv-open-btn'), dl=root.querySelector('#imgv-dl'),
        thumbs=root.querySelector('#imgv-thumbs');

  function apply(){
    img.style.transform='translate('+px.toFixed(1)+'px,'+py.toFixed(1)+'px) scale('+zoom.toFixed(3)+')';
    zb.textContent=Math.round(zoom*100)+'%';
    stage.classList.toggle('zoomed', zoom>1.01);
  }
  function setZoom(z){ zoom=Math.min(4,Math.max(.5,z)); if(zoom<=1.01){zoom=1;px=0;py=0;} apply(); }

  function show(i){
    idx=((i%list.length)+list.length)%list.length; zoom=1; px=0; py=0; apply();
    const url=list[idx], base=url.split('/').pop()||url;
    badge.textContent='Imagen '+(idx+1)+' de '+list.length;
    nameEl.textContent=base; nameEl.title=url;
    count.textContent=(idx+1)+' / '+list.length;
    prev.disabled=next.disabled=(list.length<2);
    img.style.display=''; img.style.opacity=.35;
    img.onload =()=>{ img.style.opacity=1; const ph=stage.querySelector('.imgv-ph'); if(ph) ph.remove(); };
    img.onerror=()=>{
      img.style.display='none';
      if(!stage.querySelector('.imgv-ph')){
        const ph=document.createElement('div'); ph.className='imgv-ph';
        ph.innerHTML='<div class="ph-frame">'+I('image',44)+'</div>'+
          '<b style="color:#cfe0d8;font-size:13.5px">'+esc(base)+'</b>'+
          '<div style="font-size:11.5px;line-height:1.6;max-width:440px">La imagen todavía no se encuentra disponible.<br>'+
          'Se mostrará automáticamente desde <span class="mono" style="color:#7dd8b5">'+esc(url)+'</span><br>'+
          'cuando el sistema la genere en ese subdirectorio.</div>';
        stage.appendChild(ph);
      }
    };
    img.src=url;
    dl.href=url; dl.setAttribute('download',base);
    openBtn.onclick=()=>window.open(url,'_blank');
    if(thumbs) thumbs.querySelectorAll('.imgv-th').forEach(t=>t.classList.toggle('on', +t.dataset.i===idx));
  }

  if(thumbs){
    thumbs.innerHTML=list.map((u,i)=>'<div class="imgv-th" data-i="'+i+'" data-tip="'+esc(u.split('/').pop()||u)+'">'+
      '<img src="'+esc(u)+'" alt=""><span class="th-idx">'+(i+1)+'</span></div>').join('');
    thumbs.querySelectorAll('img').forEach(im=>im.addEventListener('error',()=>{ im.outerHTML=I('image',20); }));
    thumbs.querySelectorAll('.imgv-th').forEach(t=>t.addEventListener('click',()=>show(+t.dataset.i)));
  }

  prev.addEventListener('click',()=>show(idx-1));
  next.addEventListener('click',()=>show(idx+1));
  root.querySelector('#zm-in').addEventListener('click',()=>setZoom(zoom*1.25));
  root.querySelector('#zm-out').addEventListener('click',()=>setZoom(zoom/1.25));
  root.querySelector('#zm-reset').addEventListener('click',()=>setZoom(1));
  stage.addEventListener('wheel',e=>{ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.15:0.87)); },{passive:false});
  stage.addEventListener('dblclick',()=>setZoom(zoom>1.01?1:2.2));
  stage.addEventListener('mousedown',e=>{ if(zoom<=1.01) return; drag={x:e.clientX-px,y:e.clientY-py}; stage.classList.add('dragging'); });
  window.addEventListener('mousemove',e=>{ if(!drag||!document.body.contains(ov)) return; px=e.clientX-drag.x; py=e.clientY-drag.y; apply(); });
  window.addEventListener('mouseup',()=>{ drag=null; stage.classList.remove('dragging'); });

  /* Navegación con teclado (se autolimpia al cerrar el modal) */
  const onKey=e=>{
    if(!document.body.contains(ov)){ document.removeEventListener('keydown',onKey); return; }
    const all=$$('#modal-root .modal-ov'); if(all.length&&all[all.length-1]!==ov) return;
    if(e.key==='ArrowRight') show(idx+1); else if(e.key==='ArrowLeft') show(idx-1);
  };
  document.addEventListener('keydown',onKey);

  show(idx);
  return ov;
}

/* Opciones agrupadas por categoría para todos los combos */
function providerOptions(){
  const groups={};
  Object.entries(PROVIDERS).forEach(([k,p])=>{ (groups[p.g]=groups[p.g]||[]).push([k,p]); });
  return Object.entries(groups).map(([g,items])=>
    '<optgroup label="'+g+'">'+items.map(([k,p])=>
      '<option value="'+k+'"'+(k===CURRENT_PROVIDER?' selected':'')+'>'+p.n+'</option>').join('')+'</optgroup>').join('');
}
/* Sincroniza todos los combos de mapa base del documento */
function syncBasemapSelects(){
  document.querySelectorAll('#sel-map, .basemap-sel').forEach(s=>{ if(s) s.value=CURRENT_PROVIDER; });
}

function setBaseLayer(m){
  if(m._base) m.removeLayer(m._base);
  const p=PROVIDERS[CURRENT_PROVIDER];
  m._base=L.tileLayer(p.url,{attribution:p.attr,maxZoom:p.max}).addTo(m);
}
function setProviderGlobal(k){
  CURRENT_PROVIDER=k; localStorage.setItem('eflx-basemap',k);
  MAPS.forEach(setBaseLayer);
  syncBasemapSelects();
}
function destroyMaps(){ MAPS.forEach(m=>{try{m.remove()}catch(e){}}); MAPS=[]; }

});

function makeMap(el, opts={}){
  const m = L.map(el, {zoomControl:true, ...opts});

}

/* ── Tabla genérica con orden + paginación ── */
function dataTable(cfg){
  const key=cfg.key, per=cfg.per||8;
  const st = S.sort[key] || {k:null,dir:1};
  let rows=[...cfg.rows];
  if(st.k){
    const col=cfg.cols.find(c=>c.k===st.k);
    rows.sort((a,b)=>{ let x=col&&col.sv?col.sv(a):a[st.k], y=col&&col.sv?col.sv(b):b[st.k];
      if(typeof x==='number'&&typeof y==='number') return (x-y)*st.dir;
      return String(x??'').localeCompare(String(y??''), 'es')*st.dir; });
  }
  const total=rows.length, pages=Math.max(1,Math.ceil(total/per));
  if(!S.page[key]||S.page[key]>pages) S.page[key]=1;
  const page=S.page[key], slice=rows.slice((page-1)*per,page*per);
  const th=cfg.cols.map(c=>{
    const on=st.k===c.k, arr=on?(st.dir>0?'▲':'▼'):'';
    return '<th data-act="sort" data-key="'+key+'" data-col="'+c.k+'" style="cursor:'+(c.k?'pointer':'default')+'">'+c.l+'<span class="th-arrow">'+(c.k?arr:'')+'</span></th>';
  }).join('');
  const tb=slice.map(r=>'<tr>'+cfg.cols.map(c=>'<td'+(c.cls?' class="'+c.cls+'"':'')+'>'+(c.render?c.render(r):esc(r[c.k]??'—'))+'</td>').join('')+'</tr>').join('');
  let pag='';
  if(total>0){
    const btns=[]; for(let i=1;i<=pages;i++) btns.push('<button class="pag-btn'+(i===page?' on':'')+'" data-act="page" data-key="'+key+'" data-p="'+i+'">'+i+'</button>');
    pag='<div class="pag"><span>Mostrando <b>'+((page-1)*per+1)+'–'+Math.min(page*per,total)+'</b> de <b>'+total+'</b> registros</span>'+
      '<div class="row"><button class="pag-btn" data-act="page" data-key="'+key+'" data-p="'+(page-1)+'" '+(page<=1?'disabled':'')+'>‹</button>'+btns.join('')+
      '<button class="pag-btn" data-act="page" data-key="'+key+'" data-p="'+(page+1)+'" '+(page>=pages?'disabled':'')+'>›</button></div></div>';
  }
  return '<div class="tblwrap"><table class="tbl"><thead><tr>'+th+'</tr></thead><tbody>'+(tb||'')+'</tbody></table>'+
    (total===0?'<div class="empty">'+I('search',26)+'<br><br>No se encontraron registros con los filtros actuales.</div>':pag)+'</div>';
}

/* ══════════════════════════ KPIs ══════════════════════════ */
function computeKPIs(){
  const vr=visitasRango();
  const ok=vr.filter(v=>estadoVisita(v)==='ok');
  const ns=vr.filter(v=>estadoVisita(v)==='noserv');
  const dh=despachosHoy();
  const uServ=new Set(dh.map(d=>d.UnidadId));
  const activos=new Set();
  vr.forEach(v=>v.ContenedoresVisitas.forEach(cv=>activos.add(cv.ContenedorId)));
  const cliActivos=new Set(D.Contenedores.filter(c=>!isNullDate(c.FechaBaja)).map(c=>(clienteDeContenedor(c.Id)||{}).Id).filter(Boolean));
  const incid=D.Desbordes.filter(x=>inRange(x.Fecha)).length + D.DañosContenedor.filter(x=>inRange(x.Fecha)).length;
  const visHoy=vr.filter(v=>sameDay(v.FechaHoraInicio,FECHA_REF));
  return {
    clientes:cliActivos.size,
    conts:activos.size,
    uDisp:D.Unidades.filter(u=>!uServ.has(u.Id)).length,
    uServ:uServ.size,
    despHoy:dh.length,
    visOkHoy:visHoy.filter(v=>estadoVisita(v)==='ok').length,
    visPendHoy:pendientesDeHoy().length,
    nsHoy:visHoy.filter(v=>v.NoServicio).length,
    incid,
    vr, ok, ns, activos
  };
}

function initDashMap(){
  const m=makeMap('map-dash',{center:[29.078,-110.955],zoom:12});
  const LG={unidades:L.featureGroup(),contenedores:L.featureGroup(),rutas:L.featureGroup(),centros:L.featureGroup(),incidencias:L.featureGroup(),ubicaciones:L.featureGroup()};
  D.CentrosDisposicion.forEach(cd=>LG.centros.addLayer(L.marker([cd.Latitud,cd.Longitud],{icon:mkIcon('mk-center')}).bindPopup('<div class="pp-t">'+esc(cd.Nombre)+'</div><div class="pp-s">Centro de disposición final</div>')));
  D.UbicacionesContenedores.forEach(u=>LG.ubicaciones.addLayer(L.marker([u.Latitud,u.Longitud],{icon:mkIcon('mk-ubi')}).bindPopup('<div class="pp-t">'+esc(u.Descripcion)+'</div><div class="pp-s">'+esc(u.TipoUbicacion)+' · Coordenadas '+u.Latitud.toFixed(4)+', '+u.Longitud.toFixed(4)+'</div>')));
  despachosHoy().forEach(d=>{
    const clientes=d.ClientesRuta.map(id=>byId(D.Clientes,id)).filter(Boolean);
    if(clientes.length){
      LG.rutas.addLayer(L.polyline(clientes.map(c=>[c.Latitud,c.Longitud]),{color:'#0f6e5c',weight:3,opacity:.7,dashArray:'7 7'}).bindTooltip('Ruta '+esc(d.Codigo)));
      const vs=visitasDeDespacho(d.Id);
      const ult=vs.filter(v=>estadoVisita(v)==='ok').pop();
      const p=ult?byId(D.Clientes,ult.ClienteId):clientes[0];
      LG.unidades.addLayer(L.marker([p.Latitud+0.0035,p.Longitud+0.002],{icon:mkIcon('mk-truck'),zIndexOffset:900})
        .bindPopup('<div class="pp-t">'+esc((byId(D.Unidades,d.UnidadId)||{}).Nombre||'')+'</div><div class="pp-s">Despacho '+esc(d.Codigo)+' · '+esc(d.Nombre)+'</div>'+
        '<div class="pp-row">'+I('users',13)+' Clientes asignados: '+d.ClientesRuta.length+'</div>'+
        '<div class="pp-row">'+I('check',13)+' Atendidos: '+vs.filter(v=>estadoVisita(v)==='ok').length+'</div>'+
        '<div class="pp-row">'+I('x',13)+' Sin servicio: '+vs.filter(v=>v.NoServicio).length+'</div>'+
        '<span class="pp-link" data-act="despacho" data-id="'+d.Id+'">Ver detalle del despacho</span>'));
    }
  });
  const noServHoy=new Set(D.ClientesVisitas.filter(v=>v.NoServicio&&sameDay(v.FechaHoraInicio,FECHA_REF)).map(v=>v.ClienteId));
  const servHoy=new Set(D.ClientesVisitas.filter(v=>!v.NoServicio&&sameDay(v.FechaHoraInicio,FECHA_REF)).map(v=>v.ClienteId));
  D.Contenedores.forEach(c=>{
    const cl=clienteDeContenedor(c.Id); if(!cl||isNullDate(c.FechaBaja)) return;
    if(!despachosHoy().some(d=>d.ClientesRuta.includes(cl.Id))) return;
    const cls=servHoy.has(cl.Id)?'ok':noServHoy.has(cl.Id)?'bad':'mut';
    LG.contenedores.addLayer(L.marker([c.Latitud,c.Longitud],{icon:mkIcon('mk-bin',cls)}).bindPopup(popupContHTML(c)));
  });
  D.Desbordes.filter(x=>inRange(x.Fecha)).forEach(x=>{ const c=byId(D.Clientes,x.ShapeOid);
    if(c) LG.incidencias.addLayer(L.marker([c.Latitud+0.0012,c.Longitud-0.0012],{icon:mkIcon('mk-alert'),zIndexOffset:800})
      .bindPopup('<div class="pp-t">Desborde reportado</div><div class="pp-s">'+esc(c.NombreNegocio)+'</div><div class="pp-row">'+I('alerttri',13)+' '+esc(x.Observaciones||'')+'</div><span class="pp-link" data-act="desborde" data-id="'+x.Id+'">Ver detalle</span>')); });
  Object.entries(LG).forEach(([k,g])=>{ if(S.layers[k]) g.addTo(m); });
  S._dashLG=LG; S._dashMap=m;
}

function renderMotivos(){
  const cont={}; visitasRango().forEach(v=>{ if(v.NoServicio){ const r=byId(D.RazonesNoServicio,v.RazonNoServicioId); if(r) cont[r.Nombre]=(cont[r.Nombre]||0)+1; }});

/* ══════════════════════════ VISITAS ══════════════════════════ */
function renderVisitas(){
  S.filters.vis=S.filters.vis||{q:'',estado:'',disp:''};
  const f=S.filters.vis;
  let rows=visitasRango().slice().sort((a,b)=>String(b.FechaHoraInicio).localeCompare(String(a.FechaHoraInicio)));
  if(f.q) rows=rows.filter(v=>{const c=byId(D.Clientes,v.ClienteId)||{};return (c.NombreNegocio+' '+c.SubtipoCliente).toUpperCase().includes(f.q.toUpperCase());});
  if(f.estado) rows=rows.filter(v=>estadoVisita(v)===f.estado);
  if(f.disp) rows=rows.filter(v=>String(v.DispatchId)===f.disp);
  $('#content').innerHTML =
  '<div class="page-head"><div><div class="page-title">'+I('clipboard',20)+' Visitas a clientes</div><div class="page-sub">Resultados reportados desde la aplicación móvil</div></div></div>'+
  '<div class="card" style="padding:13px 16px;margin-bottom:16px"><div class="row">'+
    '<div class="field" style="width:250px"><span class="lbl">Buscar cliente</span><input class="inp" data-fl="vis:q" value="'+esc(f.q)+'" placeholder="Nombre del negocio…"></div>'+
    '<div class="field" style="width:190px"><span class="lbl">Despacho</span><select class="sel" data-fl="vis:disp"><option value="">Todos</option>'+D.Despachos.map(d=>'<option value="'+d.Id+'"'+(String(f.disp)===String(d.Id)?' selected':'')+'>'+esc(d.Codigo)+'</option>').join('')+'</select></div>'+
    '<div class="field" style="width:170px"><span class="lbl">Estado</span><select class="sel" data-fl="vis:estado"><option value="">Todos</option><option value="ok"'+(f.estado==='ok'?' selected':'')+'>Servicio realizado</option><option value="noserv"'+(f.estado==='noserv'?' selected':'')+'>Sin servicio</option></select></div>'+
    '<div class="spacer"></div><div class="row" style="color:var(--text-3);font-size:12px">'+I('filter',14)+' '+rows.length+' visitas en el período</div></div></div>'+
  '<div id="tbl-vis"></div>';
  S.updater=()=>{
    $('#tbl-vis').innerHTML=dataTable({key:'vis',per:8,rows,
      cols:[
        {k:'ClienteId',l:'Cliente',sv:r=>r.ClienteId,render:r=>{const c=byId(D.Clientes,r.ClienteId)||{};return '<b>'+esc(c.NombreNegocio||'—')+'</b><div class="muted" style="font-size:11px">'+esc(c.SubtipoCliente||'')+'</div>';}},
        {k:'DispatchId',l:'Despacho',sv:r=>r.DispatchId,render:r=>{const d=byId(D.Despachos,r.DispatchId)||{};return '<span class="chip qr">'+esc(d.Codigo||'—')+'</span>';}},
        {k:'FechaHoraInicio',l:'Fecha · Inicio',render:r=>fmtDate(r.FechaHoraInicio)+' · '+fmtTime(r.FechaHoraInicio)},
        {k:'FechaHoraFin',l:'Fin',render:r=>isNullDate(r.FechaHoraFin)?'—':fmtTime(r.FechaHoraFin)},
        {k:'_dur',l:'Duración',sv:r=>isNullDate(r.FechaHoraFin)?0:(toDate(r.FechaHoraFin)-toDate(r.FechaHoraInicio)),render:r=>fmtDur(r.FechaHoraInicio,r.FechaHoraFin)},
        {k:'_ncont',l:'Contenedores',sv:r=>r.ContenedoresVisitas.length,render:r=>'<b>'+r.ContenedoresVisitas.length+'</b>'},
        {k:'NoServicio',l:'Resultado',sv:r=>r.NoServicio?1:0,render:r=>r.NoServicio?
          '<div>'+badgeVisita('noserv')+'<div class="muted" style="font-size:10.5px;margin-top:3px">'+esc((byId(D.RazonesNoServicio,r.RazonNoServicioId)||{}).Nombre||'')+'</div></div>':badgeVisita('ok')},
        {k:'_act',l:'',render:r=>'<div class="td-act"><button class="mini-btn" data-act="visita" data-id="'+r.Id+'" data-tip="Detalle de la visita">'+I('eye',14)+'</button></div>'}
      ]});
  };
  S.updater();
}
function modalVisita(v){
  const c=byId(D.Clientes,v.ClienteId)||{}, d=byId(D.Despachos,v.DispatchId)||{}, u=byId(D.Unidades,(d||{}).UnidadId)||{};
  const razon=v.NoServicio?byId(D.RazonesNoServicio,v.RazonNoServicioId):null;
  const cerrado = razon && razon.Id===4;
  const coordIni = v.ContenedoresVisitas.length? v.ContenedoresVisitas[0] : c;
  const coordFin = v.ContenedoresVisitas.length? v.ContenedoresVisitas[v.ContenedoresVisitas.length-1] : c;
  const body=
   (v.NoServicio?'<div style="display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--err) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--err) 40%,transparent);border-left:4px solid var(--err);padding:12px 14px;border-radius:11px;margin-bottom:14px">'+
     I('alerttri',18)+'<div><b style="color:var(--err)">Servicio no realizado</b><div style="font-size:12.5px;margin-top:2px">Razón: '+esc(razon?razon.Nombre:'—')+'</div>'+
     (cerrado?'<div style="font-size:12px;color:var(--text-2);margin-top:2px">El cliente se encontraba cerrado / sin encargado al momento de la visita.</div>':'')+
     (v.FotoNoServicioUrl?'<div style="margin-top:8px"><button class="btn sm danger" data-act="foto" data-id="'+esc(v.FotoNoServicioUrl)+'">'+I('camera',13)+' Mostrar imagen de no servicio</button></div>':'')+'</div></div>':'')+
   '<div class="fsec-t">Información del cliente</div>'+
   kvGrid([['Nombre del negocio','<b>'+esc(c.NombreNegocio)+'</b>'],['ID / referencia','<span class="mono">#'+String(c.Id).padStart(4,'0')+'</span>'],
     ['Propietario',esc(c.NombrePropietario)],['Contacto',esc(c.NombreContacto)],
     ['Teléfono',esc(c.Telefono)],['Celular',esc(c.Celular)],
     ['Dirección',esc(c.Calle+' '+(c.NumeroExterior||'')+' · CP '+c.CodigoPostal)],
     ['Tipo de cliente',badge(esc(c.TipoCliente),'info')+' '+badge(esc(c.SubtipoCliente),'mut')],
     ['Tipo de residuo','<span class="chip">'+I(iconoResiduo((byId(D.TiposResiduos,c.TipoResiduoId)||{}).Nombre),12)+' '+esc((byId(D.TiposResiduos,c.TipoResiduoId)||{}).Nombre||'')+'</span>']])+
   '<div class="fsec-t" style="margin-top:14px">Información de la visita</div>'+
   kvGrid([['Despacho','<span class="chip qr">'+esc(d.Codigo||'—')+'</span>'],['Unidad',esc(u.Nombre||'—')],
     ['Fecha · hora de inicio',fmtDT(v.FechaHoraInicio)],['Fecha · hora de fin',fmtDT(v.FechaHoraFin)],
     ['Duración','<b>'+fmtDur(v.FechaHoraInicio,v.FechaHoraFin)+'</b>'],
     ['Coordenadas de inicio','<span class="mono">'+coordIni.Latitud.toFixed(5)+', '+coordIni.Longitud.toFixed(5)+'</span>'],
     ['Coordenadas de fin','<span class="mono">'+coordFin.Latitud.toFixed(5)+', '+coordFin.Longitud.toFixed(5)+'</span>'],
     ['Resultado',badgeVisita(v.NoServicio?'noserv':(isNullDate(v.FechaHoraFin)?'pend':'ok'))]])+
   '<div class="fsec-t" style="margin-top:14px">Ubicación del cliente y contenedores</div>'+
   '<div id="map-vis" class="map-box sm" style="margin:8px 0 14px;border-radius:12px;border:1px solid var(--border)"></div>'+
   '<div class="fsec-t">Contenedores registrados en la visita ('+v.ContenedoresVisitas.length+')</div>'+
   (v.ContenedoresVisitas.length? v.ContenedoresVisitas.map(cv=>{const ct=byId(D.Contenedores,cv.ContenedorId)||{};
     return '<div class="ruta-cli" data-act="contenedor" data-id="'+cv.ContenedorId+'">'+
     '<span class="mk mk-bin ok" style="width:28px;height:28px;border-radius:8px">'+I('bin',13)+'</span>'+
     '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px">'+esc(ct.Descripcion||cv.Codigo)+'</div>'+
     '<div style="font-size:10.5px;color:var(--text-3)" class="mono">'+esc(cv.Codigo)+' · QR '+esc(cv.CodigoQR)+' · '+esc((tipoContFull(byId(D.TiposContenedor,ct.TipoContenedorId)||{}).Descripcion||''))+'</div>'+
     (cv.Observaciones?'<div style="font-size:11px;color:var(--text-2);margin-top:2px">'+esc(cv.Observaciones)+'</div>':'')+'</div>'+
     '<span style="font-size:10.5px;color:var(--text-3)">'+fmtTime(cv.FechaHoraInicio)+'–'+fmtTime(cv.FechaHoraFin)+'</span></div>';}).join('')
    :'<div class="empty">Sin contenedores atendidos'+(v.NoServicio?' (no se proporcionó el servicio).':'.')+'</div>');
  openModal({title:esc(c.NombreNegocio||'Visita'), sub:'Cliente ID #'+String(c.Id).padStart(4,'0')+' · Visita #'+v.Id, icon:'clipboard', size:'wide', body,
    footer:'<button class="btn ghost" data-act="close-modal">Cerrar</button><button class="btn soft" data-act="cliente" data-id="'+c.Id+'">'+I('building',15)+' Ver ficha del cliente</button>'});
  setTimeout(()=>{
    const m=makeMap('map-vis',{center:[c.Latitud,c.Longitud],zoom:15});
    L.marker([c.Latitud,c.Longitud],{icon:mkIcon('mk-pin')}).addTo(m)
      .bindPopup('<div class="pp-t">'+esc(c.NombreNegocio)+'</div><div class="pp-s">Cliente ID #'+String(c.Id).padStart(4,'0')+'</div>');
    contsDeCliente(c.Id).forEach(ct=>L.marker([ct.Latitud,ct.Longitud],{icon:mkIcon('mk-bin','mut')}).addTo(m).bindPopup(popupContHTML(ct)));
  },260);
}

/* ══════════════════════════ INCIDENCIAS ══════════════════════════ */
function renderIncidencias(){
  const t=S.tab.inc||'desb';
  const desb=D.Desbordes.filter(x=>inRange(x.Fecha)).sort((a,b)=>String(b.Fecha).localeCompare(String(a.Fecha)));
  const danos=D.DañosContenedor.filter(x=>inRange(x.Fecha)).sort((a,b)=>String(b.Fecha).localeCompare(String(a.Fecha)));
  $('#content').innerHTML =
  '<div class="page-head"><div><div class="page-title">'+I('alerttri',20)+' Incidencias operativas</div><div class="page-sub">Desbordes y daños de contenedores reportados desde campo</div></div></div>'+
  '<div class="tabs" style="margin-bottom:16px"><button class="tab'+(t==='desb'?' active':'')+'" data-act="tab" data-key="inc" data-id="desb">'+I('alerttri',13)+' Desbordes ('+desb.length+')</button>'+
  '<button class="tab'+(t==='dano'?' active':'')+'" data-act="tab" data-key="inc" data-id="dano">'+I('wrench',13)+' Daños de contenedores ('+danos.length+')</button></div><div id="inc-body"></div>';
  const body=$('#inc-body');
  if(t==='desb'){
    body.innerHTML='<div class="stat-cards" style="margin-bottom:16px">'+desb.map(x=>{const c=byId(D.Clientes,x.ShapeOid)||{};
      return '<div class="card lift" style="padding:15px;cursor:pointer" data-act="desborde" data-id="'+x.Id+'">'+
      '<div class="row" style="margin-bottom:8px">'+badge(I('alerttri',12)+' Desborde','err')+'<span class="spacer"></span><span style="font-size:11px;color:var(--text-3)">'+fmtDT(x.Fecha)+'</span></div>'+
      '<div style="font:700 13px Sora;margin-bottom:6px">'+esc(c.NombreNegocio||'—')+'</div>'+
      '<div style="font-size:12px;color:var(--text-2)">'+esc(x.Observaciones||'')+'</div>'+
      '<div class="row" style="margin-top:10px"><button class="btn sm soft" data-act="fotos-desborde" data-id="'+x.Id+'">'+I('image',13)+' Mostrar imágenes ('+x.FotosUrls.length+')</button><span class="chip">'+I('pin',12)+' '+c.Latitud.toFixed(3)+', '+c.Longitud.toFixed(3)+'</span></div></div>';}).join('')+'</div>'+
    dataTable({key:'desb',per:6,rows:desb,cols:[
      {k:'Fecha',l:'Fecha',render:r=>fmtDT(r.Fecha)},
      {k:'ShapeOid',l:'Cliente',sv:r=>r.ShapeOid,render:r=>esc((byId(D.Clientes,r.ShapeOid)||{}).NombreNegocio||'—')},
      {k:'Observaciones',l:'Observaciones'},
      {k:'FotosUrls',l:'Evidencia',sv:r=>r.FotosUrls.length,render:r=>r.FotosUrls.length?'<button class="btn sm soft" data-act="fotos-desborde" data-id="'+r.Id+'">'+I('image',13)+' Mostrar ('+r.FotosUrls.length+')</button>':'<span class="muted">—</span>'},
      {k:'_a',l:'',render:r=>'<div class="td-act"><button class="mini-btn" data-act="desborde" data-id="'+r.Id+'" data-tip="Detalle">'+I('eye',14)+'</button></div>'}]});
  } else {
    body.innerHTML='<div class="stat-cards" style="margin-bottom:16px">'+danos.map(x=>{const ct=byId(D.Contenedores,x.ContenedorId)||{}; const td=byId(D["TiposDaño"],x.TipoDañoId)||{};
      return '<div class="card lift" style="padding:15px;cursor:pointer" data-act="dano" data-id="'+x.Id+'">'+
      '<div class="row" style="margin-bottom:8px">'+badge(I('wrench',12)+' '+esc(td.Nombre||''),'warn')+'<span class="spacer"></span><span style="font-size:11px;color:var(--text-3)">'+fmtDT(x.Fecha)+'</span></div>'+
      '<div style="font:700 13px Sora;margin-bottom:6px">'+esc(ct.Descripcion||ct.Codigo||'—')+'</div>'+
      '<div class="row"><span class="chip qr">'+I('qr',12)+' '+esc(ct.CodigoQR||'')+'</span><button class="btn sm soft" data-act="fotos-dano" data-id="'+x.Id+'">'+I('image',13)+' Mostrar imágenes ('+x.FotosUrls.length+')</button></div></div>';}).join('')+'</div>'+
    dataTable({key:'dano',per:6,rows:danos,cols:[
      {k:'Fecha',l:'Fecha',render:r=>fmtDT(r.Fecha)},
      {k:'ContenedorId',l:'Contenedor',sv:r=>r.ContenedorId,render:r=>{const ct=byId(D.Contenedores,r.ContenedorId)||{};return '<b>'+esc(ct.Codigo||'—')+'</b> · '+esc(ct.Descripcion||'');}},
      {k:'TipoDañoId',l:'Tipo de daño',sv:r=>r.TipoDañoId,render:r=>badge(esc((byId(D["TiposDaño"],r.TipoDañoId)||{}).Nombre||''),'warn')},
      {k:'FotosUrls',l:'Evidencia',sv:r=>r.FotosUrls.length,render:r=>r.FotosUrls.length?'<button class="btn sm soft" data-act="fotos-dano" data-id="'+r.Id+'">'+I('image',13)+' Mostrar ('+r.FotosUrls.length+')</button>':'<span class="muted">—</span>'},
      {k:'_a',l:'',render:r=>'<div class="td-act"><button class="mini-btn" data-act="dano" data-id="'+r.Id+'" data-tip="Detalle">'+I('eye',14)+'</button></div>'}]});
  }
}
function modalDesborde(x){
  const c=byId(D.Clientes,x.ShapeOid)||{};
  const body=kvGrid([['Cliente','<b>'+esc(c.NombreNegocio||'—')+'</b>'],['ID / referencia','<span class="mono">#'+String(c.Id).padStart(4,'0')+'</span>'],
    ['Dirección',esc(c.Calle+' '+(c.NumeroExterior||'')+' · CP '+c.CodigoPostal)],['Fecha del reporte',fmtDT(x.Fecha)]])+
   '<div class="fsec-t" style="margin-top:14px">Observaciones</div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px 14px">'+esc(x.Observaciones||'—')+'</div>'+
   '<div class="fsec-t" style="margin-top:14px">Evidencia fotográfica ('+x.FotosUrls.length+')</div>'+
   (x.FotosUrls.length
     ? '<div class="row" style="margin-bottom:9px"><button class="btn primary" data-act="fotos-desborde" data-id="'+x.Id+'">'+I('image',15)+' Mostrar imágenes ('+x.FotosUrls.length+')</button></div>'+
       '<div class="row">'+x.FotosUrls.map(f=>'<div class="thumb" data-act="foto" data-id="'+esc(f)+'"><div class="th-ico">'+I('image',22)+'</div>'+esc(f.split('/').pop())+'</div>').join('')+'</div>'
     : '<div class="empty">Sin imágenes registradas para este desborde.</div>')+
   '<div class="fsec-t" style="margin-top:14px">Ubicación del cliente y contenedores</div>'+
   '<div id="map-desb" class="map-box sm" style="margin-top:8px;border-radius:12px;border:1px solid var(--border)"></div>';
  openModal({title:'Desborde reportado', sub:esc(c.NombreNegocio||''), icon:'alerttri', size:'wide', body,
    footer:'<button class="btn ghost" data-act="close-modal">Cerrar</button><button class="btn soft" data-act="cliente" data-id="'+c.Id+'">'+I('building',15)+' Ver cliente</button>'});

    L.marker([c.Latitud,c.Longitud],{icon:mkIcon('mk-alert')}).addTo(m).bindPopup('<div class="pp-t">Desborde</div><div class="pp-s">'+esc(c.NombreNegocio)+'</div>');
    contsDeCliente(c.Id).forEach(ct=>L.marker([ct.Latitud,ct.Longitud],{icon:mkIcon('mk-bin','warn')}).addTo(m).bindPopup(popupContHTML(ct)));
  },260);
}
function modalDano(x){

  const body='<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px">'+

    ['Código QR','<span class="mono">'+esc(ct.CodigoQR||'')+'</span>'],['Tipo',esc((tipoContFull(byId(D.TiposContenedor,ct.TipoContenedorId)||{}).Descripcion||'—'))],
    ['Cliente asignado',cl?esc(cl.NombreNegocio):'Sin cliente (resguardo)'],['Fecha del daño',fmtDT(x.Fecha)],
    ['Tipo de daño',badge(I('wrench',12)+' '+esc(td.Nombre||''),'warn')]])+'</div></div>'+
   '<div class="fsec-t">Evidencia fotográfica ('+x.FotosUrls.length+')</div>'+
   (x.FotosUrls.length
     ? '<div class="row" style="margin-bottom:9px"><button class="btn primary" data-act="fotos-dano" data-id="'+x.Id+'">'+I('image',15)+' Mostrar imágenes ('+x.FotosUrls.length+')</button></div>'+
       '<div class="row">'+x.FotosUrls.map(f=>'<div class="thumb" data-act="foto" data-id="'+esc(f)+'"><div class="th-ico">'+I('image',22)+'</div>'+esc(f.split('/').pop())+'</div>').join('')+'</div>'
     : '<div class="empty">Sin imágenes registradas para este daño.</div>')+
   '<div class="fsec-t" style="margin-top:14px">Ubicación</div>'+
   '<div id="map-dano" class="map-box sm" style="margin-top:8px;border-radius:12px;border:1px solid var(--border)"></div>';
  openModal({title:'Daño de contenedor '+esc(ct.Codigo||''), sub:'Tipo: '+esc(td.Nombre||''), icon:'wrench', size:'wide', body,
    footer:'<button class="btn ghost" data-act="close-modal">Cerrar</button>'+(cl?'<button class="btn soft" data-act="cliente" data-id="'+cl.Id+'">'+I('building',15)+' Ver cliente</button>':'')});
  setTimeout(()=>{ const m=makeMap('map-dano',{center:[ct.Latitud,ct.Longitud],zoom:16});
    L.marker([ct.Latitud,ct.Longitud],{icon:mkIcon('mk-bin','bad')}).addTo(m).bindPopup(popupContHTML(ct));
    if(cl) L.marker([cl.Latitud,cl.Longitud],{icon:mkIcon('mk-pin')}).addTo(m).bindPopup('<div class="pp-t">'+esc(cl.NombreNegocio)+'</div><div class="pp-s">Cliente ID #'+String(cl.Id).padStart(4,'0')+'</div>');
  },260);
}

/* ══════════════════════════ CLIENTES ══════════════════════════ */
function renderClientes(){
  S.filters.cli=S.filters.cli||{q:'',res:'',tipo:'',est:''};
  const f=S.filters.cli;
  let rows=D.Clientes.slice();
  if(f.q) rows=rows.filter(c=>(c.NombreNegocio+' '+c.NombrePropietario+' '+c.SubtipoCliente).toUpperCase().includes(f.q.toUpperCase()));
  if(f.res) rows=rows.filter(c=>String(c.TipoResiduoId)===f.res);
  if(f.tipo) rows=rows.filter(c=>(c.TipoCliente||'').toUpperCase().includes(f.tipo.toUpperCase()));
  if(f.est) rows=rows.filter(c=>estadoClienteHoy(c)===f.est);
  $('#content').innerHTML =
  '<div class="page-head"><div><div class="page-title">'+I('users',20)+' Clientes</div><div class="page-sub">Cartera de clientes con contenedores en servicio</div></div>'+
  '<div class="spacer"></div><button class="btn soft" data-act="nav" data-id="mapa">'+I('map',15)+' Ver en mapa</button></div>'+
  '<div class="card" style="padding:13px 16px;margin-bottom:16px"><div class="row">'+
   '<div class="field" style="width:250px"><span class="lbl">Búsqueda</span><input class="inp" data-fl="cli:q" value="'+esc(f.q)+'" placeholder="Negocio, propietario…"></div>'+
   '<div class="field" style="width:170px"><span class="lbl">Tipo de residuo</span><select class="sel" data-fl="cli:res"><option value="">Todos</option>'+selOpts(D.TiposResiduos,parseInt(f.res)||0,t=>t.Nombre)+'</select></div>'+
   '<div class="field" style="width:170px"><span class="lbl">Tipo de cliente</span><input class="inp" data-fl="cli:tipo" value="'+esc(f.tipo)+'" placeholder="AUTOSERVICIO…"></div>'+
   '<div class="field" style="width:160px"><span class="lbl">Estado hoy</span><select class="sel" data-fl="cli:est"><option value="">Todos</option><option value="ok"'+(f.est==='ok'?' selected':'')+'>Servicio realizado</option><option value="noserv"'+(f.est==='noserv'?' selected':'')+'>Sin servicio</option><option value="pend"'+(f.est==='pend'?' selected':'')+'>Pendiente</option></select></div>'+
   '<div class="spacer"></div><span style="color:var(--text-3);font-size:12px">'+rows.length+' clientes</span></div></div>'+
  '<div id="tbl-cli"></div>';
  S.updater=()=>{
    $('#tbl-cli').innerHTML=dataTable({key:'cli',per:8,rows,
      cols:[

function renderInspecciones(){
  S.filters.insp=S.filters.insp||{q:'',uni:'',ver:''};
  const f=S.filters.insp;
  let rows=D.InspeccionesUnidad.slice().sort((a,b)=>String(b.Fecha).localeCompare(String(a.Fecha)));
  if(f.uni) rows=rows.filter(i=>String(i.UnidadId)===f.uni);
  if(f.ver) rows=rows.filter(i=>String(i.Verificado)===f.ver);
  if(f.q) rows=rows.filter(i=>((byId(D.ConceptosInspeccion,i.ConceptoInspeccionId)||{}).Descripcion||'').toUpperCase().includes(f.q.toUpperCase()));
  const porUnidad=D.Unidades.map(u=>{
    const ins=D.InspeccionesUnidad.filter(i=>i.UnidadId===u.Id);
    const last=ins.length?ins[0].Fecha:null;
    const lastIns=ins.filter(i=>i.Fecha===last);
    return {u, total:ins.length, last, ok:lastIns.filter(i=>i.Verificado).length, nlast:lastIns.length};
  });
  $('#content').innerHTML =
  '<div class="page-head"><div><div class="page-title">'+I('clipboard',20)+' Inspecciones de unidades</div><div class="page-sub">Checklist de flotilla antes de salida</div></div></div>'+
  '<div class="stat-cards" style="margin-bottom:18px">'+porUnidad.map(p=>{
    const pct=p.nlast?Math.round(p.ok/p.nlast*100):0;
    return '<div class="card lift" style="padding:15px;cursor:pointer" data-act="checklist" data-id="'+p.u.Id+'">'+
    '<div class="row" style="margin-bottom:9px"><div class="kpi-ico" style="width:38px;height:38px;--k:'+(pct===100?'var(--ok)':'var(--warn)')+'">'+I('truck',17)+'</div>'+
    '<div><div style="font:700 13px Sora">'+esc(p.u.Codigo)+'</div><div class="muted" style="font-size:10.5px">'+(p.last?'Última: '+fmtDT(p.last):'Sin inspecciones')+'</div></div>'+
    '<span class="spacer"></span>'+(pct===100?badge('Conforme','ok'):badge(pct+'% conforme','warn'))+'</div>'+
    '<div class="prog">'+progBar([{v:p.ok,c:'#2f9e63',t:'Verificados'},{v:p.nlast-p.ok,c:'#d9483b',t:'No verificados'}])+'</div>'+
    '<div style="font-size:11px;color:var(--text-3);margin-top:7px">'+p.ok+' de '+p.nlast+' conceptos verificados · '+p.total+' registros históricos</div></div>';
  }).join('')+'</div>'+
  '<div class="card" style="padding:13px 16px;margin-bottom:16px"><div class="row">'+
   '<div class="field" style="width:250px"><span class="lbl">Buscar concepto</span><input class="inp" data-fl="insp:q" value="'+esc(f.q)+'" placeholder="REVISAR LLANTAS…"></div>'+
   '<div class="field" style="width:200px"><span class="lbl">Unidad</span><select class="sel" data-fl="insp:uni"><option value="">Todas</option>'+selOpts(D.Unidades,parseInt(f.uni)||0,u=>u.Nombre)+'</select></div>'+
   '<div class="field" style="width:170px"><span class="lbl">Verificado</span><select class="sel" data-fl="insp:ver"><option value="">Todos</option><option value="true"'+(f.ver==='true'?' selected':'')+'>Verificado</option><option value="false"'+(f.ver==='false'?' selected':'')+'>No verificado</option></select></div>'+
   '<div class="spacer"></div><span style="color:var(--text-3);font-size:12px">'+rows.length+' registros</span></div></div>'+
  '<div id="tbl-insp"></div>';
  S.updater=()=>{
    $('#tbl-insp').innerHTML=dataTable({key:'insp',per:8,rows,
      cols:[
        {k:'Fecha',l:'Fecha de inspección',render:i=>fmtDT(i.Fecha)},
        {k:'UnidadId',l:'Unidad',sv:i=>i.UnidadId,render:i=>'<b>'+esc((byId(D.Unidades,i.UnidadId)||{}).Nombre||'')+'</b>'},
        {k:'ConceptoInspeccionId',l:'Concepto de inspección',sv:i=>i.ConceptoInspeccionId,render:i=>esc((byId(D.ConceptosInspeccion,i.ConceptoInspeccionId)||{}).Descripcion||'')},
        {k:'Verificado',l:'Verificado',sv:i=>i.Verificado?1:0,render:i=>i.Verificado?badge(I('check',12)+' Verificado','ok'):badge(I('x',12)+' No verificado','err')},
        {k:'_a',l:'',render:i=>'<div class="td-act"><button class="mini-btn" data-act="checklist" data-id="'+i.UnidadId+'" data-tip="Checklist de la unidad">'+I('clipboard',14)+'</button></div>'}
      ]});
  };
  S.updater();

    LG.contenedores.addLayer(mk); items.push({g:'Contenedores',t:c.Descripcion||c.Codigo,s:'QR '+c.CodigoQR,ico:'bin',mk});
  });

      LG.unidades.addLayer(mk); items.push({g:'Unidades',t:u.Nombre,s:'Despacho '+d.Codigo,ico:'truck',mk});
    }
  });
  D.CentrosDisposicion.forEach(cd=>{
    const mk=L.marker([cd.Latitud,cd.Longitud],{icon:mkIcon('mk-center')}).bindPopup('<div class="pp-t">'+esc(cd.Nombre)+'</div><div class="pp-s">Centro de disposición final</div>');
    LG.centros.addLayer(mk); items.push({g:'Centros de disposición',t:cd.Nombre,s:cd.Latitud.toFixed(4)+', '+cd.Longitud.toFixed(4),ico:'factory',mk});
  });
  D.Desbordes.forEach(x=>{ const c=byId(D.Clientes,x.ShapeOid); if(!c) return;

    LG.incidencias.addLayer(mk); items.push({g:'Incidencias',t:'Desborde · '+c.NombreNegocio,s:fmtDate(x.Fecha),ico:'alerttri',mk});
  });
  D.UbicacionesContenedores.forEach(u=>{
    const mk=L.marker([u.Latitud,u.Longitud],{icon:mkIcon('mk-ubi')}).bindPopup('<div class="pp-t">'+esc(u.Descripcion)+'</div><div class="pp-s">'+esc(u.TipoUbicacion)+'</div>');
    LG.ubicaciones.addLayer(mk); items.push({g:'Patio / Taller',t:u.Descripcion,s:u.TipoUbicacion,ico:'home',mk});
  });
  Object.entries(LG).forEach(([k,g])=>{ if(S.layers[k]) g.addTo(m); });
  const visible=Object.entries(S.layers).filter(([k,v])=>v).map(([k])=>k);
  const groups={clientes:'Clientes',contenedores:'Contenedores',unidades:'Unidades',centros:'Centros de disposición',incidencias:'Incidencias',ubicaciones:'Patio / Taller'};
  $('#gis-list').innerHTML=items.filter(it=>visible.some(k=>{ if(k==='rutas') return false;
      return groups[k]===it.g; })).map(it=>
    '<div class="act-item" data-act="focus" data-g="'+esc(it.g)+'" data-t="'+esc(it.t)+'"><div class="act-ico info">'+I(it.ico,15)+'</div>'+

    ||'<div class="empty">Active capas para ver elementos.</div>';
  S._gisMap=m; S._gisItems=items;
}
