  '<div class="card lift"><div class="card-h"><div class="card-t">'+I('clipboard',15)+' Inspecciones por unidad</div></div><div class="card-b">'+
    dataTable({key:'rinsp',per:8,rows:D.Unidades,cols:[
      {k:'Codigo',l:'Unidad',render:u=>'<b>'+esc(u.Nombre)+'</b>'},
      {k:'_t',l:'Inspecciones',sv:u=>D.InspeccionesUnidad.filter(i=>i.UnidadId===u.Id&&inRange(i.Fecha)).length,render:u=>D.InspeccionesUnidad.filter(i=>i.UnidadId===u.Id&&inRange(i.Fecha)).length},
      {k:'_ok',l:'Verificados',sv:u=>D.InspeccionesUnidad.filter(i=>i.UnidadId===u.Id&&inRange(i.Fecha)&&i.Verificado).length,render:u=>D.InspeccionesUnidad.filter(i=>i.UnidadId===u.Id&&inRange(i.Fecha)&&i.Verificado).length},
      {k:'_p',l:'Conformidad',sv:u=>{const t=D.InspeccionesUnidad.filter(i=>i.UnidadId===u.Id&&inRange(i.Fecha)); return t.length?t.filter(i=>i.Verificado).length/t.length:0;},
        render:u=>{const t=D.InspeccionesUnidad.filter(i=>i.UnidadId===u.Id&&inRange(i.Fecha)); const p=t.length?Math.round(t.filter(i=>i.Verificado).length/t.length*100):0;
          return '<div class="row" style="min-width:150px"><div class="prog" style="flex:1">'+progBar([{v:p,c:p===100?'#2f9e63':'#d9981e',t:'%'},{v:100-p,c:'var(--border)',t:''}])+'</div><b>'+p+'%</b></div>';}},
      {k:'_a',l:'',render:u=>'<div class="td-act"><button class="mini-btn" data-act="checklist" data-id="'+u.Id+'">'+I('clipboard',14)+'</button></div>'}]})+'</div></div>';
  const dias=[]; for(let d=new Date(S.range.ini); d<=new Date(S.range.fin); d.setDate(d.getDate()+1)) dias.push(d.toISOString().slice(0,10));
  mkChart('r-dia',{type:'line',data:{labels:dias.map(x=>fmtDate(x).slice(0,6)),
    datasets:[{label:'Visitas',data:dias.map(x=>vr.filter(v=>v.FechaHoraInicio.slice(0,10)===x).length),borderColor:CPAL[0],backgroundColor:'rgba(15,110,92,.14)',fill:true,tension:.35,pointRadius:4,pointHoverRadius:8},
      {label:'Sin servicio',data:dias.map(x=>vr.filter(v=>v.FechaHoraInicio.slice(0,10)===x&&v.NoServicio).length),borderColor:CPAL[3],tension:.35,pointRadius:4,pointHoverRadius:8}]},
    options:{plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{stepSize:2},grid:{color:cssVar('--border')}},x:{grid:{display:false}}}}});
  mkChart('r-kg',{type:'bar',data:{labels:kgPorUnidad.map(x=>x.u.Codigo),
    datasets:[{label:'Kg recolectados (est.)',data:kgPorUnidad.map(x=>Math.round(x.kg)),backgroundColor:CPAL[1],borderRadius:6,borderSkipped:false,hoverBackgroundColor:'#1d5ea3'}]},
    options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:cssVar('--border')}},x:{grid:{display:false}}}}});
  mkChart('r-cli',{type:'bar',data:{labels:porCliente.slice(0,8).map(x=>x.c.SubtipoCliente||x.c.NombreNegocio.slice(0,14)),
    datasets:[{label:'Visitas',data:porCliente.slice(0,8).map(x=>x.vs),backgroundColor:CPAL[0],borderRadius:5,borderSkipped:false,hoverBackgroundColor:'#0a4d40'}]},
    options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:1},grid:{color:cssVar('--border')}},y:{grid:{display:false}}}}});
  mkChart('r-res',{type:'doughnut',data:{labels:D.TiposResiduos.map(t=>t.Nombre),
    datasets:[{data:D.TiposResiduos.map(t=>D.Clientes.filter(c=>c.TipoResiduoId===t.Id).length),backgroundColor:CPAL,borderWidth:2,borderColor:cssVar('--surface'),hoverOffset:12}]},
    options:{plugins:{legend:{position:'bottom',labels:{boxWidth:11}}},cutout:'60%'}});
}

/* ══════════════════════════ BÚSQUEDA GLOBAL ══════════════════════════ */
function globalSearch(q){
  const box=$('#gs-list');
  if(!q||q.length<2){ box.classList.remove('show'); return; }
  const Q=q.toUpperCase(); const res=[];
  D.Clientes.filter(c=>(c.NombreNegocio+' '+c.SubtipoCliente).toUpperCase().includes(Q)).slice(0,4).forEach(c=>res.push({k:'Cliente',t:c.NombreNegocio,act:'cliente',id:c.Id,ico:'building'}));
  D.Contenedores.filter(c=>(c.Codigo+' '+c.CodigoQR+' '+c.Descripcion).toUpperCase().includes(Q)).slice(0,4).forEach(c=>res.push({k:'Contenedor',t:c.Codigo+' · '+(c.Descripcion||''),act:'contenedor',id:c.Id,ico:'bin'}));
  D.Unidades.filter(u=>(u.Nombre+' '+u.Codigo+' '+u.Marca).toUpperCase().includes(Q)).slice(0,3).forEach(u=>res.push({k:'Unidad',t:u.Nombre,act:'unidad',id:u.Id,ico:'truck'}));
  D.Despachos.filter(d=>(d.Codigo+' '+d.Nombre).toUpperCase().includes(Q)).slice(0,3).forEach(d=>res.push({k:'Despacho',t:d.Codigo+' · '+d.Nombre,act:'despacho',id:d.Id,ico:'route'}));
  box.innerHTML=res.length?res.map(r=>'<div class="gs-item" data-act="'+r.act+'" data-id="'+r.id+'"><span style="color:var(--primary)">'+I(r.ico,15)+'</span><div><div style="font-weight:600;font-size:12.5px">'+esc(r.t)+'</div><div class="gs-k">'+r.k+'</div></div></div>').join(''):'<div class="gs-item">Sin resultados…</div>';
  box.classList.add('show');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.tb-search')) { const b=$('#gs-list'); if(b) b.classList.remove('show'); }
});

/* ══════════════════════════ DELEGACIÓN DE EVENTOS ══════════════════════════ */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  switch(a){
    case 'nav': go(id); break;
    case 'sb-toggle': document.body.classList.toggle('sb-collapsed'); document.body.classList.toggle('sb-open'); break;
    case 'theme': {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme==='dark'?'light':'dark';
      /* Si el mapa base es Carto Claro/Oscuro, conmuta junto con el tema */
      if(CURRENT_PROVIDER==='claro') setProviderGlobal('oscuro');
      else if(CURRENT_PROVIDER==='oscuro') setProviderGlobal('claro');
      go(S.view); break;
    }
    case 'close-modal': closeModalEl(t.closest('.modal-ov')); break;
    case 'layer': S.layers[id]=S.layers[id]?0:1; go(S.view); break;
    case 'acttab': S.tab.act=id; renderActList(); $$('#content .tabs .tab').forEach(b=>b.classList.toggle('active', b.dataset.id===(S.tab.act||'todo'))); break;
    case 'tab': S.tab[id]=t.dataset.id; go(S.view); break;
    case 'sort': { const key=t.dataset.key, col=t.dataset.col; if(!col) break;
      const st=S.sort[key]||{k:null,dir:1};
      S.sort[key]= st.k===col? {k:col,dir:-st.dir} : {k:col,dir:1};
      if(S.updater) S.updater(); break; }
    case 'page': { const p=parseInt(t.dataset.p); const key=t.dataset.key;
      if(p>=1){ S.page[key]=p; if(S.updater) S.updater(); } break; }
    case 'cliente': modalCliente(byId(D.Clientes,+id)||D.Clientes[0]); break;
    case 'contenedor': modalContenedor(byId(D.Contenedores,+id)); break;
    case 'unidad': modalUnidad(byId(D.Unidades,+id)); break;
    case 'despacho': modalDespacho(byId(D.Despachos,+id)); break;
    case 'ruta': { const d=byId(D.Despachos,+id); if(d) modalRuta(d); break; }
    case 'visita': modalVisita(byId(D.ClientesVisitas,+id)); break;
    case 'desborde': modalDesborde(byId(D.Desbordes,+id)); break;
    case 'dano': modalDano(byId(D.DañosContenedor,+id)); break;
    case 'ubicacion': modalUbicacion(byId(D.UbicacionesContenedores,+id)); break;
    case 'checklist': modalChecklist(+id); break;
    case 'centro-map': { const c=byId(D.CentrosDisposicion,+id);
      openModal({title:esc(c.Nombre), sub:'Centro de disposición final', icon:'factory', body:'<div id="map-cd" class="map-box sm" style="border-radius:12px;border:1px solid var(--border)"></div>'});
      setTimeout(()=>{ const m=makeMap('map-cd',{center:[c.Latitud,c.Longitud],zoom:14});
        L.marker([c.Latitud,c.Longitud],{icon:mkIcon('mk-center')}).addTo(m).bindPopup('<div class="pp-t">'+esc(c.Nombre)+'</div><div class="pp-s">Centro de disposición</div>');
      },260); break; }
    /* ── Visor de imágenes ── */
    case 'foto': {  /* Resuelve la lista completa a la que pertenece la URL y abre el visor en esa imagen */
      const url=String(id);
      let list=null, ctx='';
      const db=D.Desbordes.find(x=>x.FotosUrls.includes(url));
      if(db){ list=db.FotosUrls; ctx='Evidencia · Desborde en '+esc((byId(D.Clientes,db.ShapeOid)||{}).NombreNegocio||''); }
      if(!list){ const dn=D.DañosContenedor.find(x=>x.FotosUrls.includes(url));
        if(dn){ list=dn.FotosUrls; ctx='Evidencia · Daño de contenedor '+esc((byId(D.Contenedores,dn.ContenedorId)||{}).Codigo||''); } }
      if(!list){ const vs=D.ClientesVisitas.find(x=>x.FotoNoServicioUrl===url);
        if(vs){ list=[url]; ctx='Evidencia · No servicio en '+esc((byId(D.Clientes,vs.ClienteId)||{}).NombreNegocio||''); } }
      list=list||[url];
      openImageViewer(list,{title:ctx||'Evidencia fotográfica', startAt:list.indexOf(url)});
      break; }
    case 'fotos-desborde': { const x=byId(D.Desbordes,+id); if(x){ const c=byId(D.Clientes,x.ShapeOid)||{};
      openImageViewer(x.FotosUrls,{title:'Evidencia · Desborde', sub:esc(c.NombreNegocio||'')+' · '+fmtDate(x.Fecha)}); } break; }
    case 'fotos-dano': { const x=byId(D.DañosContenedor,+id); if(x){ const ct=byId(D.Contenedores,x.ContenedorId)||{};
      openImageViewer(x.FotosUrls,{title:'Evidencia · Daño de contenedor', sub:esc(ct.Codigo||'')+' · '+esc((byId(D['TiposDaño'],x.TipoDañoId)||{}).Nombre||'')}); } break; }
    case 'locate-cli': { const c=byId(D.Clientes,+id); closeAllModals(); go('mapa');
      setTimeout(()=>{ if(S._gisMap){ S._gisMap.flyTo([c.Latitud,c.Longitud],16); } },500); break; }
    case 'locate-cont': { const c=byId(D.Contenedores,+id); closeAllModals(); go('mapa');
      setTimeout(()=>{ if(S._gisMap){ S._gisMap.flyTo([c.Latitud,c.Longitud],16); } },500); break; }
    case 'focus': { const it=(S._gisItems||[]).find(x=>x.g===t.dataset.g && x.t===t.dataset.t);
      if(it && S._gisMap){ S._gisMap.flyTo(it.mk.getLatLng(),16); it.mk.openPopup(); } break; }
    case 'export': toast('Exportación de resumen simulada (demostración).'); break;
  }
});
/* Filtros y búsquedas en vivo */
document.addEventListener('input', e=>{
  const f=e.target.dataset.fl; if(!f) return;
  const [scope,field]=f.split(':');
  S.filters[scope]=S.filters[scope]||{};
  S.filters[scope][field]=e.target.value;
  S.page[scope==='vis'?'vis':scope==='cli'?'cli':scope==='cont'?'cont':'insp']=1;
  if(S.updater) S.updater();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeTopModal(); });

/* ══════════════════════════ INICIO ══════════════════════════ */
document.title=(D.DatosGenerales.NombreEmpresa||'ECOFLUX')+' · Control de Recolección';
renderSidebar(); renderTopbar(); go('dashboard');
</script>
