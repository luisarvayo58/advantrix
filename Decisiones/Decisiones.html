<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOFLUX · Gestión de Recolección de Residuos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* ============ VARIABLES / TEMA ============ */
        :root {
            --bg: #edf1ee;
            --surface: #ffffff;
            --surface-2: #f5f8f6;
            --surface-3: #eaf0ec;
            --border: #d8e0dc;
            --border-strong: #bcc9c2;
            --text: #182420;
            --text-2: #5c6b64;
            --text-3: #8d9b93;
            --primary: #0f6e5c;
            --primary-600: #0b584a;
            --primary-soft: #e0f0eb;
            --primary-text: #0b584a;
            --accent: #3aa384;
            --focus: rgba(15,110,92,.28);
            --ok: #2f9e63;
            --warn: #d9981e;
            --err: #d9483b;
            --info: #2f7fd1;
            --purp: #7c5cd6;
            --grad1: #0f6e5c;
            --grad2: #3aa384;
            --shadow: 0 2px 10px rgba(16,34,28,.08);
            --shadow-lg: 0 14px 34px rgba(16,34,28,.16);
            --r: 14px;
        }

        [data-theme="dark"] {
            --bg: #0d1310;
            --surface: #151f1b;
            --surface-2: #1a2621;
            --surface-3: #20302a;
            --border: #2a3a33;
            --border-strong: #3d5148;
            --text: #e7eeea;
            --text-2: #a3b3aa;
            --text-3: #71857b;
            --primary: #3ecfa8;
            --primary-600: #2fb894;
            --primary-soft: rgba(62,207,168,.13);
            --primary-text: #57dcb8;
            --accent: #3ecfa8;
            --grad1: #12463b;
            --grad2: #1f6a58;
            --shadow: 0 2px 12px rgba(0,0,0,.45);
            --shadow-lg: 0 16px 40px rgba(0,0,0,.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html, body {
            height: 100%
        }

        body {
            font: 14px/1.45 Inter,system-ui,sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden
        }

        h1, h2, h3, .sb-brand, .tb-app, .kpi-val, .modal-t, .card-t {
            font-family: Sora,Inter,sans-serif
        }

        ::-webkit-scrollbar {
            width: 9px;
            height: 9px
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 9px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        svg.ic {
            flex: none;
            vertical-align: middle
        }

        /* ============ LAYOUT ============ */
        #app {
            display: flex;
            height: 100vh
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0
        }

        #content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 40px
        }

        /* ============ SIDEBAR ============ */
        .sidebar {
            width: 248px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width .22s,transform .22s;
            z-index: 60;
            overflow: hidden
        }

        .sb-brand {
            display: flex;
            gap: 11px;
            align-items: center;
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--border)
        }

        .sb-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg,var(--primary),var(--accent));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow)
        }

        .sb-name {
            font-weight: 800;
            font-size: 16px;
            letter-spacing: .4px
        }

            .sb-name span {
                color: var(--primary)
            }

        .sb-sub {
            font-size: 10.5px;
            color: var(--text-3);
            letter-spacing: .6px;
            text-transform: uppercase
        }

        .sb-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10px 14px
        }

        .sb-glabel {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-3);
            padding: 14px 10px 6px
        }

        .sb-item {
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
            padding: 9px 11px;
            margin: 2px 0;
            border: 1px solid transparent;
            border-radius: 10px;
            background: none;
            color: var(--text-2);
            font: 500 13.5px Inter;
            cursor: pointer;
            text-align: left;
            transition: .16s;
            white-space: nowrap
        }

            .sb-item:hover {
                background: var(--surface-2);
                color: var(--text);
                border-color: var(--border);
                transform: translateX(3px)
            }

            .sb-item.active {
                background: var(--primary-soft);
                color: var(--primary-text);
                border-color: color-mix(in srgb,var(--primary) 35%,transparent);
                box-shadow: inset 3px 0 0 var(--primary)
            }

                .sb-item.active svg {
                    color: var(--primary)
                }

        .sb-foot {
            padding: 12px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-3)
        }

        body.sb-collapsed .sidebar {
            width: 66px
        }

        body.sb-collapsed .sb-label, body.sb-collapsed .sb-name, body.sb-collapsed .sb-sub, body.sb-collapsed .sb-glabel, body.sb-collapsed .sb-foot {
            display: none
        }

        body.sb-collapsed .sb-item {
            justify-content: center;
            padding: 11px
        }

        @media (max-width:1023px) {
            .sidebar {
                position: fixed;
                inset: 0 auto 0 0;
                transform: translateX(-105%);
                box-shadow: var(--shadow-lg)
            }

            body.sb-open .sidebar {
                transform: none
            }

            body.sb-collapsed .sidebar {
                width: 248px
            }

            body.sb-collapsed .sb-label, body.sb-collapsed .sb-name, body.sb-collapsed .sb-sub, body.sb-collapsed .sb-glabel {
                display: block
            }
        }

        /* ============ TOPBAR / BREADCRUMB ============ */
        #topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap
        }

        .tb-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0
        }

        .tb-app {
            font-weight: 800;
            font-size: 17px;
            letter-spacing: .3px
        }

            .tb-app span {
                color: var(--primary)
            }

        .tb-comp {
            font-size: 11px;
            color: var(--text-3);
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .tb-date {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-soft);
            border: 1px solid color-mix(in srgb,var(--primary) 35%,transparent);
            color: var(--primary-text);
            padding: 7px 13px;
            border-radius: 11px;
            font-weight: 600;
            font-size: 12.5px
        }

        .tb-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: .16s
        }

            .icon-btn:hover {
                color: var(--primary-text);
                border-color: var(--primary);
                background: var(--primary-soft);
                transform: translateY(-2px);
                box-shadow: var(--shadow)
            }

        .tb-search {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 0 12px;
            height: 36px;
            color: var(--text-3)
        }

            .tb-search input {
                border: none;
                outline: none;
                background: none;
                font: 500 13px Inter;
                color: var(--text);
                width: 190px
            }

        .gs-res {
            position: absolute;
            top: 44px;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: none;
            z-index: 80;
            max-height: 320px;
            overflow-y: auto
        }

            .gs-res.show {
                display: block
            }

        .gs-item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 9px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 13px
        }

            .gs-item:hover {
                background: var(--primary-soft)
            }

            .gs-item .gs-k {
                font-size: 10px;
                color: var(--text-3);
                text-transform: uppercase;
                letter-spacing: .6px
            }

        .tb-map {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11.5px;
            color: var(--text-3)
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg,var(--purp),var(--info));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12.5px
        }

        #breadcrumb {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-3)
        }

            #breadcrumb b {
                color: var(--primary-text);
                font-weight: 600
            }

            #breadcrumb .cr-sep {
                opacity: .5
            }

        /* ============ COMPONENTES ============ */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            transition: transform .18s,box-shadow .18s,border-color .18s
        }

            .card.lift:hover {
                transform: translateY(-3px);
                box-shadow: var(--shadow-lg);
                border-color: var(--border-strong)
            }

        .card-h {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap
        }

        .card-t {
            font-size: 15px;
            font-weight: 700
        }

        .card-s {
            font-size: 11.5px;
            color: var(--text-3)
        }

        .card-b {
            padding: 16px
        }

        .page-head {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 18px
        }

        .page-title {
            font-size: 21px;
            font-weight: 800
        }

        .page-sub {
            font-size: 12.5px;
            color: var(--text-3)
        }

        .spacer {
            flex: 1
        }

        .muted {
            color: var(--text-3)
        }

        .mono {
            font-family: ui-monospace,Menlo,Consolas,monospace;
            font-size: 12px
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font: 600 13px Inter;
            cursor: pointer;
            transition: .16s;
            box-shadow: var(--shadow)
        }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-lg)
            }

            .btn:active {
                transform: none
            }

            .btn.primary {
                background: linear-gradient(135deg,var(--primary),var(--accent));
                color: #fff;
                border-color: transparent
            }

                .btn.primary:hover {
                    filter: brightness(1.07)
                }

            .btn.soft {
                background: var(--primary-soft);
                color: var(--primary-text);
                border-color: color-mix(in srgb,var(--primary) 30%,transparent)
            }

            .btn.danger {
                background: color-mix(in srgb,var(--err) 12%,var(--surface));
                color: var(--err);
                border-color: color-mix(in srgb,var(--err) 40%,transparent)
            }

            .btn.sm {
                padding: 6px 11px;
                font-size: 12px;
                border-radius: 9px
            }

            .btn.ghost {
                background: transparent;
                box-shadow: none
            }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 99px;
            font: 600 11px Inter;
            letter-spacing: .2px;
            border: 1px solid transparent;
            white-space: nowrap
        }

            .badge.ok {
                background: color-mix(in srgb,var(--ok) 14%,var(--surface));
                color: var(--ok);
                border-color: color-mix(in srgb,var(--ok) 38%,transparent)
            }

            .badge.warn {
                background: color-mix(in srgb,var(--warn) 15%,var(--surface));
                color: var(--warn);
                border-color: color-mix(in srgb,var(--warn) 40%,transparent)
            }

            .badge.err {
                background: color-mix(in srgb,var(--err) 13%,var(--surface));
                color: var(--err);
                border-color: color-mix(in srgb,var(--err) 38%,transparent)
            }

            .badge.info {
                background: color-mix(in srgb,var(--info) 13%,var(--surface));
                color: var(--info);
                border-color: color-mix(in srgb,var(--info) 38%,transparent)
            }

            .badge.purp {
                background: color-mix(in srgb,var(--purp) 13%,var(--surface));
                color: var(--purp);
                border-color: color-mix(in srgb,var(--purp) 38%,transparent)
            }

            .badge.mut {
                background: var(--surface-3);
                color: var(--text-2);
                border-color: var(--border)
            }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            font: 600 11.5px Inter;
            color: var(--text-2)
        }

            .chip.qr {
                font-family: ui-monospace,monospace;
                color: var(--primary-text);
                border-color: color-mix(in srgb,var(--primary) 35%,transparent);
                background: var(--primary-soft)
            }

        .inp, .sel {
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1.5px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            font: 500 13px Inter;
            outline: none;
            transition: .15s;
            box-shadow: inset 0 1px 3px rgba(0,0,0,.04)
        }

            .inp:focus, .sel:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 4px var(--focus)
            }

        .sel {
            cursor: pointer;
            appearance: auto
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0
        }

        .lbl {
            font: 600 11.5px Inter;
            color: var(--text-2);
            letter-spacing: .2px
        }

        .tabs {
            display: inline-flex;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 3px;
            gap: 2px;
            flex-wrap: wrap
        }

        .tab {
            padding: 6px 13px;
            border-radius: 8px;
            border: none;
            background: none;
            color: var(--text-2);
            font: 600 12px Inter;
            cursor: pointer;
            transition: .15s
        }

            .tab:hover {
                color: var(--text)
            }

            .tab.active {
                background: var(--surface);
                color: var(--primary-text);
                box-shadow: var(--shadow)
            }

        /* ============ TOOLTIP ============ */
        [data-tip] {
            position: relative
        }

            [data-tip]:hover::after {
                content: attr(data-tip);
                position: absolute;
                bottom: calc(100% + 9px);
                left: 50%;
                transform: translateX(-50%);
                background: #101d18;
                color: #fff;
                padding: 7px 11px;
                border-radius: 9px;
                font: 500 11.5px Inter;
                width: max-content;
                max-width: 280px;
                z-index: 999;
                box-shadow: 0 8px 22px rgba(0,0,0,.35);
                pointer-events: none;
                line-height: 1.4;
                border: 1px solid rgba(255,255,255,.14)
            }

        /* ============ KPI ============ */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            gap: 16px;
            margin-bottom: 18px
        }

        @media(max-width:1100px) {
            .kpi-grid {
                grid-template-columns: repeat(2,minmax(0,1fr))
            }
        }

        @media(max-width:640px) {
            .kpi-grid {
                grid-template-columns: 1fr
            }
        }

        .kpi {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            border-radius: var(--r);
            border: 1.5px solid var(--k);
            background: color-mix(in srgb,var(--k) 13%,var(--surface));
            box-shadow: var(--shadow);
            cursor: default;
            transition: transform .2s,box-shadow .2s,background .2s
        }

            .kpi:hover {
                background: var(--k);
                transform: translateY(-4px) scale(1.015);
                box-shadow: 0 18px 34px color-mix(in srgb,var(--k) 45%,rgba(0,0,0,.25))
            }

                .kpi:hover .kpi-ico {
                    color: #fff;
                    background: rgba(255,255,255,.18);
                    border-color: rgba(255,255,255,.45)
                }

        .kpi-ico {
            width: 48px;
            height: 48px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--k);
            background: color-mix(in srgb,var(--k) 14%,var(--surface));
            border: 1.5px solid color-mix(in srgb,var(--k) 45%,transparent);
            flex: none;
            transition: .2s
        }

        .kpi-val {
            font-size: 29px;
            font-weight: 800;
            line-height: 1;
            color: var(--text)
        }

        .kpi-t {
            font: 700 12px Inter;
            color: var(--text-2);
            margin-top: 4px;
            letter-spacing: .2px
        }

        .kpi-sub {
            font-size: 10.5px;
            color: var(--text-3);
            margin-top: 3px
        }

        .k-green {
            --k: #2f9e63
        }

        .k-blue {
            --k: #2f7fd1
        }

        .k-yellow {
            --k: #d9981e
        }

        .k-orange {
            --k: #e07b2a
        }

        .k-purple {
            --k: #7c5cd6
        }

        .k-red {
            --k: #d9483b
        }

        /* ============ TABLAS ============ */
        .tblwrap {
            border: 1px solid var(--border);
            border-radius: var(--r);
            overflow: auto;
            background: var(--surface);
            box-shadow: var(--shadow)
        }

        table.tbl {
            width: 100%;
            border-collapse: collapse;
            min-width: 640px
        }

        .tbl th {
            position: sticky;
            top: 0;
            z-index: 5;
            text-align: left;
            padding: 11px 13px;
            font: 600 11.5px Inter;
            letter-spacing: .4px;
            color: #fff;
            background-image: linear-gradient(100deg,var(--grad1),var(--grad2),var(--grad1));
            background-size: 230% 100%;
            animation: thFlow 16s ease infinite;
            white-space: nowrap;
            cursor: pointer;
            user-select: none
        }

        @keyframes thFlow {
            0% {
                background-position: 0% 50%
            }

            50% {
                background-position: 100% 50%
            }

            100% {
                background-position: 0% 50%
            }
        }

        .tbl th .th-arrow {
            font-size: 9px;
            opacity: .85;
            margin-left: 4px
        }

        .tbl td {
            padding: 10px 13px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            vertical-align: middle
        }

        .tbl tbody tr {
            transition: background .13s
        }

            .tbl tbody tr:hover {
                background: var(--primary-soft)
            }

        .tbl .td-act {
            display: flex;
            gap: 6px
        }

        .mini-btn {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: .15s
        }

            .mini-btn:hover {
                color: var(--primary-text);
                border-color: var(--primary);
                transform: translateY(-2px);
                box-shadow: var(--shadow)
            }

        .pag {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: space-between;
            padding: 11px 14px;
            font-size: 12px;
            color: var(--text-3);
            flex-wrap: wrap
        }

        .pag-btn {
            min-width: 30px;
            height: 30px;
            padding: 0 8px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            font: 600 12px Inter;
            cursor: pointer;
            transition: .14s
        }

            .pag-btn:hover:not(:disabled) {
                border-color: var(--primary);

        function I(name, size = 18, cls = '') {
            return '<svg class="ic ' + cls + '" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.dot) + '</svg>';
        }

        /* ── Formato de fechas / utilidades ── */
        const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const p2 = n => String(n).padStart(2, '0');
        function toDate(s) { return s ? new Date(s) : null; }
        function isNullDate(s) { return !s || String(s).startsWith('0001-01-01'); }
        function fmtDate(s) { const d = toDate(s); if (!d || isNaN(d) || isNullDate(s)) return '—'; return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear(); }
        function fmtTime(s) { const d = toDate(s); if (!d || isNaN(d)) return '—'; return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
        function fmtDT(s) { return isNullDate(s) ? '—' : fmtDate(s) + ' · ' + fmtTime(s); }
        function sameDay(a, b) { return a && b && a.slice(0, 10) === b.slice(0, 10); }
        function inRange(s) { const k = s ? s.slice(0, 10) : ''; return k >= S.range.ini && k <= S.range.fin; }
        function fmtDur(a, b) {
            if (isNullDate(a) || isNullDate(b)) return '—';
            let m = Math.round((toDate(b) - toDate(a)) / 60000); if (m < 0) m = 0;
            return m >= 60 ? Math.floor(m / 60) + ' h ' + p2(m % 60) + ' min' : m + ' min';
        }
        function dist(a, b) { return Math.hypot(a.Latitud - b.Latitud, a.Longitud - b.Longitud); }

        /* ══════════════════════════ MÉTRICAS DEL PERÍODO ══════════════════════════
           Todas las métricas de la aplicación se calculan sobre el PERÍODO definido
           en DatosGenerales.FechaInicial — FechaFinal (ajustable con el rango).     */
        function despachosPeriodo() { return D.Despachos.filter(d => inRange(d.Fecha)); }
        function pendientesPeriodo() {
            const out = [];
            despachosPeriodo().forEach(d => d.ClientesRuta.forEach(cid => {
                const v = D.ClientesVisitas.find(x => x.DispatchId === d.Id && x.ClienteId === cid);
                if (!v) out.push({ clienteId: cid, dispatch: d });
            })); return out;
        }
        function estadoClientePeriodo(cl) {
            const vs = D.ClientesVisitas.filter(v => v.ClienteId === cl.Id && inRange(v.FechaHoraInicio))
                .sort((a, b) => String(b.FechaHoraInicio).localeCompare(String(a.FechaHoraInicio)));
            if (vs.length) return estadoVisita(vs[0]);
            if (despachosPeriodo().some(d => d.ClientesRuta.includes(cl.Id))) return 'pend';
            return 'nuevo';
        }
        function unidadEstado(u) { return despachosPeriodo().some(d => d.UnidadId === u.Id) ? 'servicio' : 'disp'; }

        /* ── Relaciones derivadas (respetan el modelo, no lo alteran) ── */
        const contClienteMap = {};   // ContenedorId -> ClienteId (derivado de la visita más reciente)
        D.ClientesVisitas.forEach(v => v.ContenedoresVisitas.forEach(cv => {
            const prev = contClienteMap[cv.ContenedorId];
            if (prev === undefined || v.FechaHoraInicio > prev.fecha) contClienteMap[cv.ContenedorId] = { clienteId: v.ClienteId, fecha: v.FechaHoraInicio };
        }));
        function clienteDeContenedor(id) {
            const m = contClienteMap[id];
            if (m) return byId(D.Clientes, m.clienteId);
            const c = byId(D.Contenedores, id);
            if (!c) return null;
            let best = null, bd = 1e9;
            D.Clientes.forEach(cl => { const dd = dist(cl, c); if (dd < bd) { bd = dd; best = cl; } });
            return bd < 0.004 ? best : null;
        }
        function contsDeCliente(cid) { return D.Contenedores.filter(c => (contClienteMap[c.ContenedorId] ? contClienteMap[c.ContenedorId].clienteId : null) === cid || (clienteDeContenedor(c.Id) || {}).Id === cid); }
        function ubicDeContenedor(c) { return D.UbicacionesContenedores.find(u => dist(u, c) < 0.0025) || null; }
        function tipoContFull(tc) { return { ...tc, carga: byId(D.TiposCarga, tc.TipoCargaId), cap: byId(D.CapacidadesTipoContenedor, tc.CapacidadTipoContenedorId) }; }
        function visitasDeDespacho(did) { return D.ClientesVisitas.filter(v => v.DispatchId === did); }
        function estadoVisita(v) { if (!v) return 'pend'; if (v.NoServicio) return 'noserv'; return isNullDate(v.FechaHoraFin) ? 'pend' : 'ok'; }
        function visitasRango() { return D.ClientesVisitas.filter(v => inRange(v.FechaHoraInicio)); }
        function iconoResiduo(nombre) {
            const n = String(nombre || '').toUpperCase();
            if (n.includes('ORG')) return 'leaf'; if (n.includes('INORG')) return 'recycle'; if (n.includes('MIX')) return 'shuffle';
            if (n.includes('PELIG')) return 'hazard'; if (n.includes('ELECT')) return 'cpu'; return 'dot';
        }

        /* ── QR visual decorativo (representación) ── */
        function qrVisual(txt, px = 96) {
            let h = 7; for (const ch of String(txt)) { h = (h * 31 + ch.charCodeAt(0)) >>> 0; }
            const rnd = () => { h = (h * 1103515245 + 12345) >>> 0; return (h >>> 16) / 65536; };
            const n = 21, cell = px / n; let r = '';
            const finder = (x, y) => ((x < 7 && y < 7)) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
            for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
                let on;
                if (finder(x, y)) {
                    const fx = x < n - 7 ? x : x - (n - 7), fy = y < 7 ? y : y - 7;
                    on = (fx === 0 || fx === 6 || fy === 0 || fy === 6) || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4);
                } else on = rnd() > 0.52;
                if (on) r += '<rect x="' + (x * cell).toFixed(1) + '" y="' + (y * cell).toFixed(1) + '" width="' + cell.toFixed(1) + '" height="' + cell.toFixed(1) + '"/>';
            }
            return '<svg class="qr-visual" width="' + px + '" height="' + px + '" viewBox="0 0 ' + px + ' ' + px + '" fill="currentColor" xmlns="http://www.w3.org/2000/svg">' + r + '</svg>';
        }

        /* ══════════════════════════ INFRA: MODALES / TOAST ══════════════════════════ */
        function openModal({ title, sub = '', icon = 'info', body = '', footer = '', size = '' }) {
            const ov = document.createElement('div'); ov.className = 'modal-ov';
            ov.innerHTML = '<div class="modal ' + size + '">' +
                '<div class="modal-h"><div class="modal-ico">' + I(icon, 22) + '</div>' +
                '<div style="min-width:0"><div class="modal-t">' + title + '</div><div class="modal-s">' + sub + '</div></div>' +
                '<button class="icon-btn" data-act="close-modal" style="margin-left:auto">' + I('x', 18) + '</button></div>' +
                '<div class="modal-b">' + body + '</div>' +
                (footer ? '<div class="modal-f">' + footer + '</div>' : '') + '</div>';
            ov.addEventListener('mousedown', e => { if (e.target === ov) closeModalEl(ov); });
            $('#modal-root').appendChild(ov);
            return ov;
        }
        function closeModalEl(ov) {
            ov.querySelectorAll('.leaflet-container').forEach(el => {
                MAPS.forEach(m => { try { if (m._container === el) m.remove(); } catch (e) { } });
            });
            MAPS = MAPS.filter(m => { try { return ov.contains(m._container) ? false : true; } catch (e) { return true; } });
            ov.remove();
        }
        function closeTopModal() { const all = $$('#modal-root .modal-ov'); if (all.length) closeModalEl(all[all.length - 1]); }
        function closeAllModals() { $$('#modal-root .modal-ov').forEach(o => o.remove()); MAPS.forEach(m => { try { m.remove() } catch (e) { } }); MAPS = []; }
        function toast(msg, type = 'ok') {
            const t = document.createElement('div'); t.className = 'toast' + (type === 'err' ? ' err' : '');
            t.innerHTML = I(type === 'err' ? 'alerttri' : 'check', 18) + '<span>' + esc(msg) + '</span>';
            $('#toast-root').appendChild(t); setTimeout(() => t.remove(), 3000);
        }

        /* ══════════════════════════ VISOR DE IMÁGENES (GALERÍA / LIGHTBOX) ══════════════════════════ */
        function openImageViewer(urls, opts = {}) {
            const list = (Array.isArray(urls) ? urls : [urls]).filter(Boolean).map(String);
            if (!list.length) { toast('Este registro no tiene imágenes registradas.', 'err'); return; }
            let idx = Math.min(Math.max(opts.startAt || 0, 0), list.length - 1), zoom = 1, px = 0, py = 0, drag = null;

            const ov = openModal({
                title: opts.title || 'Visor de imágenes',
                sub: (opts.sub ? opts.sub + ' · ' : '') + list.length + (list.length > 1 ? ' imágenes · ' : ' imagen · ') + 'rueda del mouse = zoom · doble clic = ampliar · ← → = navegar',
                icon: 'image', size: 'xl', body: '',
                footer: '<button class="btn ghost" data-act="close-modal">Cerrar visor</button>'
            });

            const root = ov.querySelector('.modal-b');
            root.innerHTML =
                '<div class="imgv-stage" id="imgv-stage">' +
                '<div class="imgv-badge" id="imgv-badge"></div>' +
                '<button class="imgv-nav prev" id="imgv-prev" data-tip="Imagen anterior">' + I('chevleft', 20) + '</button>' +
                '<img id="imgv-img" alt="Evidencia fotográfica">' +
                '<button class="imgv-nav next" id="imgv-next" data-tip="Imagen siguiente">' + I('chevright', 20) + '</button>' +
                '<div class="imgv-zoom-badge" id="imgv-zb">100%</div>' +
                '</div>' +
                '<div class="imgv-toolbar">' +
                '<span class="imgv-name" id="imgv-name"></span>' +
                '<button class="zm-btn" id="zm-out" data-tip="Alejar">−</button>' +
                '<button class="zm-btn" id="zm-reset" data-tip="Restablecer zoom">' + I('refresh', 14) + '</button>' +
                '<button class="zm-btn" id="zm-in" data-tip="Acercar">+</button>' +
                '<button class="btn sm soft" id="imgv-open-btn" data-tip="Abrir en pestaña nueva">' + I('eye', 13) + ' Abrir</button>' +
                '<a class="btn sm soft" id="imgv-dl" download data-tip="Descargar imagen">' + I('download', 13) + ' Descargar</a>' +
                '<span class="imgv-count" id="imgv-count"></span>' +
                '</div>' +
                (list.length > 1 ? '<div class="imgv-thumbs" id="imgv-thumbs"></div>' : '<div style="height:6px"></div>');

            const stage = root.querySelector('#imgv-stage'), img = root.querySelector('#imgv-img'),
                badge = root.querySelector('#imgv-badge'), prev = root.querySelector('#imgv-prev'),
                next = root.querySelector('#imgv-next'), zb = root.querySelector('#imgv-zb'),
                nameEl = root.querySelector('#imgv-name'), count = root.querySelector('#imgv-count'),
                openBtn = root.querySelector('#imgv-open-btn'), dl = root.querySelector('#imgv-dl'),
                thumbs = root.querySelector('#imgv-thumbs');

            function apply() {
                img.style.transform = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px) scale(' + zoom.toFixed(3) + ')';
                zb.textContent = Math.round(zoom * 100) + '%';
                stage.classList.toggle('zoomed', zoom > 1.01);
            }
            function setZoom(z) { zoom = Math.min(4, Math.max(.5, z)); if (zoom <= 1.01) { zoom = 1; px = 0; py = 0; } apply(); }

            function show(i) {
                idx = ((i % list.length) + list.length) % list.length; zoom = 1; px = 0; py = 0; apply();
                const url = list[idx], base = url.split('/').pop() || url;
                badge.textContent = 'Imagen ' + (idx + 1) + ' de ' + list.length;
                nameEl.textContent = base; nameEl.title = url;
                count.textContent = (idx + 1) + ' / ' + list.length;
                prev.disabled = next.disabled = (list.length < 2);
                img.style.display = ''; img.style.opacity = .35;
                img.onload = () => { img.style.opacity = 1; const ph = stage.querySelector('.imgv-ph'); if (ph) ph.remove(); };
                img.onerror = () => {
                    img.style.display = 'none';
                    if (!stage.querySelector('.imgv-ph')) {
                        const ph = document.createElement('div'); ph.className = 'imgv-ph';
                        ph.innerHTML = '<div class="ph-frame">' + I('image', 44) + '</div>' +
                            '<b style="color:#cfe0d8;font-size:13.5px">' + esc(base) + '</b>' +
                            '<div style="font-size:11.5px;line-height:1.6;max-width:440px">La imagen todavía no se encuentra disponible.<br>' +
                            'Se mostrará automáticamente desde <span class="mono" style="color:#7dd8b5">' + esc(url) + '</span><br>' +
                            'cuando el sistema la genere en ese subdirectorio.</div>';
                        stage.appendChild(ph);
                    }
                };
                img.src = url;
                dl.href = url; dl.setAttribute('download', base);
                openBtn.onclick = () => window.open(url, '_blank');
                if (thumbs) thumbs.querySelectorAll('.imgv-th').forEach(t => t.classList.toggle('on', +t.dataset.i === idx));
            }

            if (thumbs) {
                thumbs.innerHTML = list.map((u, i) => '<div class="imgv-th" data-i="' + i + '" data-tip="' + esc(u.split('/').pop() || u) + '">' +
                    '<img src="' + esc(u) + '" alt=""><span class="th-idx">' + (i + 1) + '</span></div>').join('');
                thumbs.querySelectorAll('img').forEach(im => im.addEventListener('error', () => { im.outerHTML = I('image', 20); }));
                thumbs.querySelectorAll('.imgv-th').forEach(t => t.addEventListener('click', () => show(+t.dataset.i)));
            }

            prev.addEventListener('click', () => show(idx - 1));
            next.addEventListener('click', () => show(idx + 1));
            root.querySelector('#zm-in').addEventListener('click', () => setZoom(zoom * 1.25));
            root.querySelector('#zm-out').addEventListener('click', () => setZoom(zoom / 1.25));
            root.querySelector('#zm-reset').addEventListener('click', () => setZoom(1));
            stage.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.15 : 0.87)); }, { passive: false });
            stage.addEventListener('dblclick', () => setZoom(zoom > 1.01 ? 1 : 2.2));
            stage.addEventListener('mousedown', e => { if (zoom <= 1.01) return; drag = { x: e.clientX - px, y: e.clientY - py }; stage.classList.add('dragging'); });
            window.addEventListener('mousemove', e => { if (!drag || !document.body.contains(ov)) return; px = e.clientX - drag.x; py = e.clientY - drag.y; apply(); });
            window.addEventListener('mouseup', () => { drag = null; stage.classList.remove('dragging'); });

            const onKey = e => {
                if (!document.body.contains(ov)) { document.removeEventListener('keydown', onKey); return; }
                const all = $$('#modal-root .modal-ov'); if (all.length && all[all.length - 1] !== ov) return;
                if (e.key === 'ArrowRight') show(idx + 1); else if (e.key === 'ArrowLeft') show(idx - 1);
            };
            document.addEventListener('keydown', onKey);

            show(idx);
            return ov;
        }

        /* ══════════════════════════ INFRA: MAPAS ══════════════════════════ */
        let MAPS = [];

        /* ── Proveedores de mapa base (todos SIN API key) ── */
        const PROVIDERS = {

            /* Terreno */
            topo: { n: 'OpenTopoMap', g: 'Terreno', url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', attr: '&copy; OpenTopoMap (CC-BY-SA)', max: 17 },
            esritopo: { n: 'Esri Topográfico', g: 'Terreno', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', attr: '&copy; Esri', max: 19 },
            esristreet: { n: 'Esri Calles', g: 'Terreno', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attr: '&copy; Esri', max: 19 },
            /* Minimalista */
            claro: { n: 'Carto Claro', g: 'Minimalista', url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', attr: '&copy; OpenStreetMap · &copy; CARTO', max: 20 },
            oscuro: { n: 'Carto Oscuro', g: 'Minimalista', url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', attr: '&copy; OpenStreetMap · &copy; CARTO', max: 20 },
            esrigris: { n: 'Esri Gris', g: 'Minimalista', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', attr: '&copy; Esri', max: 16 }
        };

        /* Variable global de mapa base, persistida en localStorage */
        let CURRENT_PROVIDER = localStorage.getItem('eflx-basemap') || 'osm';
        if (!PROVIDERS[CURRENT_PROVIDER]) CURRENT_PROVIDER = 'osm';

        /* Opciones agrupadas por categoría para todos los combos */
        function providerOptions() {
            const groups = {};
            Object.entries(PROVIDERS).forEach(([k, p]) => { (groups[p.g] = groups[p.g] || []).push([k, p]); });
            return Object.entries(groups).map(([g, items]) =>
                '<optgroup label="' + g + '">' + items.map(([k, p]) =>
                    '<option value="' + k + '"' + (k === CURRENT_PROVIDER ? ' selected' : '') + '>' + p.n + '</option>').join('') + '</optgroup>').join('');
        }
        /* Sincroniza todos los combos de mapa base del documento */
        function syncBasemapSelects() {

        function setBaseLayer(m) {
            if (m._base) m.removeLayer(m._base);
            const p = PROVIDERS[CURRENT_PROVIDER];
            m._base = L.tileLayer(p.url, { attribution: p.attr, maxZoom: p.max }).addTo(m);
        }
        function setProviderGlobal(k) {
            CURRENT_PROVIDER = k; localStorage.setItem('eflx-basemap', k);
            MAPS.forEach(setBaseLayer);
            syncBasemapSelects();
        }
        function destroyMaps() { MAPS.forEach(m => { try { m.remove() } catch (e) { } }); MAPS = []; }

        /* ── Tabla genérica con orden + paginación ── */
        function dataTable(cfg) {
            const key = cfg.key, per = cfg.per || 8;
            const st = S.sort[key] || { k: null, dir: 1 };
            let rows = [...cfg.rows];
            if (st.k) {
                const col = cfg.cols.find(c => c.k === st.k);
                rows.sort((a, b) => {
                    let x = col && col.sv ? col.sv(a) : a[st.k], y = col && col.sv ? col.sv(b) : b[st.k];
                    if (typeof x === 'number' && typeof y === 'number') return (x - y) * st.dir;
                    return String(x ?? '').localeCompare(String(y ?? ''), 'es') * st.dir;
                });
            }
            const total = rows.length, pages = Math.max(1, Math.ceil(total / per));
            if (!S.page[key] || S.page[key] > pages) S.page[key] = 1;
            const page = S.page[key], slice = rows.slice((page - 1) * per, page * per);
            const th = cfg.cols.map(c => {
                const on = st.k === c.k, arr = on ? (st.dir > 0 ? '▲' : '▼') : '';
                return '<th data-act="sort" data-key="' + key + '" data-col="' + c.k + '" style="cursor:' + (c.k ? 'pointer' : 'default') + '">' + c.l + '<span class="th-arrow">' + (c.k ? arr : '') + '</span></th>';
            }).join('');
            const tb = slice.map(r => '<tr>' + cfg.cols.map(c => '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + (c.render ? c.render(r) : esc(r[c.k] ?? '—')) + '</td>').join('') + '</tr>').join('');
            let pag = '';
            if (total > 0) {
                const btns = []; for (let i = 1; i <= pages; i++) btns.push('<button class="pag-btn' + (i === page ? ' on' : '') + '" data-act="page" data-key="' + key + '" data-p="' + i + '">' + i + '</button>');
                pag = '<div class="pag"><span>Mostrando <b>' + ((page - 1) * per + 1) + '–' + Math.min(page * per, total) + '</b> de <b>' + total + '</b> registros</span>' +
                    '<div class="row"><button class="pag-btn" data-act="page" data-key="' + key + '" data-p="' + (page - 1) + '" ' + (page <= 1 ? 'disabled' : '') + '>‹</button>' + btns.join('') +
                    '<button class="pag-btn" data-act="page" data-key="' + key + '" data-p="' + (page + 1) + '" ' + (page >= pages ? 'disabled' : '') + '>›</button></div></div>';
            }
            return '<div class="tblwrap"><table class="tbl"><thead><tr>' + th + '</tr></thead><tbody>' + (tb || '') + '</tbody></table>' +
                (total === 0 ? '<div class="empty">' + I('search', 26) + '<br><br>No se encontraron registros con los filtros actuales.</div>' : pag) + '</div>';
        }

        /* ══════════════════════════ KPIs (TODOS DEL PERÍODO) ══════════════════════════ */
        function computeKPIs() {
            const vr = visitasRango();
            const ok = vr.filter(v => estadoVisita(v) === 'ok');
            const ns = vr.filter(v => estadoVisita(v) === 'noserv');
            const dh = despachosPeriodo();
            const uServ = new Set(dh.map(d => d.UnidadId));
            const activos = new Set();
            vr.forEach(v => v.ContenedoresVisitas.forEach(cv => activos.add(cv.ContenedorId)));
            const cliActivos = new Set(D.Contenedores.filter(c => !isNullDate(c.FechaBaja)).map(c => (clienteDeContenedor(c.Id) || {}).Id).filter(Boolean));
            const incid = D.Desbordes.filter(x => inRange(x.Fecha)).length + D.DañosContenedor.filter(x => inRange(x.Fecha)).length;
            return {
                clientes: cliActivos.size,
                conts: activos.size,
                uDisp: D.Unidades.filter(u => !uServ.has(u.Id)).length,
                uServ: uServ.size,
                despPeriodo: dh.length,
                visOk: ok.length,
                visPend: pendientesPeriodo().length,
                nsPeriodo: ns.length,
                incid,
                vr, ok, ns, activos
            };
        }

            /* Contenedores de clientes en rutas del período, con su estado en el período */

            const enRutas = new Set(); despachosPeriodo().forEach(d => d.ClientesRuta.forEach(cid => enRutas.add(cid)));
            D.Contenedores.forEach(c => {

            const cols = [
                { k: 'ClienteId', l: 'Cliente', sv: r => r.ClienteId, render: r => { const c = byId(D.Clientes, r.ClienteId) || {}; return '<b>' + esc(c.NombreNegocio || '—') + '</b><div class="muted" style="font-size:11px">' + esc(c.SubtipoCliente || '') + '</div>'; } },

                '<div class="field" style="width:160px"><span class="lbl">Verificado</span><select class="sel" data-fl="insp:ver"><option value="">Todos</option><option value="true"' + (f.ver === 'true' ? ' selected' : '') + '>Verificado</option><option value="false"' + (f.ver === 'false' ? ' selected' : '') + '>No verificado</option></select></div>';
            $('#content').innerHTML =
                '<div class="page-head"><div><div class="page-title">' + I('clipboard', 20) + ' Inspecciones de unidades</div><div class="page-sub">Checklist de flotilla antes de salida · Período: ' + fmtDate(S.range.ini) + ' — ' + fmtDate(S.range.fin) + '</div></div></div>' +
                '<div class="stat-cards" style="margin-bottom:18px">' + D.Unidades.map(u => {
                    const ins = D.InspeccionesUnidad.filter(i => i.UnidadId === u.Id && inRange(i.Fecha));
                    const last = ins.length ? [...ins].sort((a, b) => String(b.Fecha).localeCompare(String(a.Fecha)))[0].Fecha : null;
                    const lastIns = ins.filter(i => i.Fecha === last);
                    const pct = lastIns.length ? Math.round(lastIns.filter(i => i.Verificado).length / lastIns.length * 100) : 0;
                    return '<div class="card lift" style="padding:15px;cursor:pointer" data-act="checklist" data-id="' + u.Id + '">' +
                        '<div class="row" style="margin-bottom:9px"><div class="kpi-ico" style="width:38px;height:38px;--k:' + (pct === 100 ? 'var(--ok)' : 'var(--warn)') + '">' + I('truck', 17) + '</div>' +
                        '<div><div style="font:700 13px Sora">' + esc(u.Codigo) + '</div><div class="muted" style="font-size:10.5px">' + (last ? 'Última: ' + fmtDT(last) : 'Sin inspecciones') + '</div></div>' +
                        '<span class="spacer"></span>' + (pct === 100 ? badge('Conforme', 'ok') : badge(pct + '% conforme', 'warn')) + '</div>' +
                        '<div class="prog">' + progBar([{ v: lastIns.filter(i => i.Verificado).length, c: '#2f9e63', t: 'Verificados' }, { v: lastIns.length - lastIns.filter(i => i.Verificado).length, c: '#d9483b', t: 'No verificados' }]) + '</div>' +
                        '<div style="font-size:11px;color:var(--text-3);margin-top:7px">' + lastIns.filter(i => i.Verificado).length + ' de ' + lastIns.length + ' conceptos verificados · ' + ins.length + ' registros en el período</div></div>';
                }).join('') + '</div>' +
                filterBar('insp', controls, 'cnt-insp') +
                '<div id="tbl-insp"></div>';
            const cols = [
                { k: 'Fecha', l: 'Fecha de inspección', render: i => fmtDT(i.Fecha) },
                { k: 'UnidadId', l: 'Unidad', sv: i => i.UnidadId, render: i => '<b>' + esc((byId(D.Unidades, i.UnidadId) || {}).Nombre || '') + '</b>' },
                { k: 'ConceptoInspeccionId', l: 'Concepto de inspección', sv: i => i.ConceptoInspeccionId, render: i => esc((byId(D.ConceptosInspeccion, i.ConceptoInspeccionId) || {}).Descripcion || '') },
                { k: 'Verificado', l: 'Verificado', sv: i => i.Verificado ? 1 : 0, render: i => i.Verificado ? badge(I('check', 12) + ' Verificado', 'ok') : badge(I('x', 12) + ' No verificado', 'err') },
                { k: '_a', l: '', render: i => '<div class="td-act"><button class="mini-btn" data-act="checklist" data-id="' + i.UnidadId + '" data-tip="Checklist de la unidad">' + I('clipboard', 14) + '</button></div>' }
            ];
            S.updater = () => {
                let rows = D.InspeccionesUnidad.filter(i => inRange(i.Fecha)).slice().sort((a, b) => String(b.Fecha).localeCompare(String(a.Fecha)));
                if (f.uni) rows = rows.filter(i => String(i.UnidadId) === f.uni);
                if (f.ver) rows = rows.filter(i => String(i.Verificado) === f.ver);
                if (f.q) rows = rows.filter(i => ((byId(D.ConceptosInspeccion, i.ConceptoInspeccionId) || {}).Descripcion || '').toUpperCase().includes(f.q.toUpperCase()));
                const cnt = $('#cnt-insp'); if (cnt) cnt.innerHTML = '<b>' + rows.length + '</b> registros en el período';
                $('#tbl-insp').innerHTML = dataTable({ key: 'insp', per: 8, rows, cols });
            };
            S.updater();
        }

                '<div class="page-head"><div><div class="page-title">' + I('map', 20) + ' Mapa GIS de operación</div><div class="page-sub">Vista geográfica unificada · Unidades y rutas del período · Mapa base: ' + PROVIDERS[CURRENT_PROVIDER].n + '</div></div></div>' +

                '<div class="card" style="padding:14px;align-self:start"><div class="lbl" style="margin-bottom:8px">Capas visibles</div>' +

                    '<span class="layer-chk' + (L1[x[0]] ? ' on' : '') + '" data-act="layer" data-id="' + x[0] + '">' + I('dot', 11) + x[1] + '</span>').join('') + '</div>' +

                '</div>';
            const m = makeMap('map-gis', { center: [29.078, -110.955], zoom: 12 });
            const LG = { clientes: L.featureGroup(), contenedores: L.featureGroup(), unidades: L.featureGroup(), rutas: L.featureGroup(), centros: L.featureGroup(), incidencias: L.featureGroup(), ubicaciones: L.featureGroup() };
            const items = [];
            D.Clientes.forEach(c => {
                const mk = L.marker([c.Latitud, c.Longitud], { icon: mkIcon('mk-pin') }).bindPopup('<div class="pp-t">' + esc(c.NombreNegocio) + '</div><div class="pp-s">Cliente ID #' + String(c.Id).padStart(4, '0') + ' · ' + esc(c.SubtipoCliente || '') + '</div><span class="pp-link" data-act="cliente" data-id="' + c.Id + '">Ver ficha del cliente</span>');
                LG.clientes.addLayer(mk); items.push({ g: 'Clientes', t: c.NombreNegocio, s: c.SubtipoCliente, ico: 'building', mk });
            });
            D.Contenedores.forEach(c => {
                const cl = clienteDeContenedor(c.Id);
                const mk = L.marker([c.Latitud, c.Longitud], { icon: mkIcon('mk-bin', isNullDate(c.FechaBaja) ? (cl ? 'ok' : 'mut') : 'bad') }).bindPopup(popupContHTML(c));
                LG.contenedores.addLayer(mk); items.push({ g: 'Contenedores', t: c.Descripcion || c.Codigo, s: 'QR ' + c.CodigoQR, ico: 'bin', mk });
            });
            despachosPeriodo().forEach(d => {
                const u = byId(D.Unidades, d.UnidadId) || {};
                const clientes = d.ClientesRuta.map(id => byId(D.Clientes, id)).filter(Boolean);
                if (clientes.length) {
                    LG.rutas.addLayer(L.polyline(clientes.map(c => [c.Latitud, c.Longitud]), { color: '#0f6e5c', weight: 3, opacity: .75, dashArray: '7 7' }));
                    const vs = visitasDeDespacho(d.Id); const ult = vs.filter(v => estadoVisita(v) === 'ok').pop();
                    const p = ult ? byId(D.Clientes, ult.ClienteId) : clientes[0];
                    const mk = L.marker([p.Latitud + 0.0035, p.Longitud + 0.002], { icon: mkIcon('mk-truck'), zIndexOffset: 900 })
                        .bindPopup('<div class="pp-t">' + esc(u.Nombre) + '</div><div class="pp-s">Despacho ' + esc(d.Codigo) + ' · ' + d.ClientesRuta.length + ' clientes</div><span class="pp-link" data-act="despacho" data-id="' + d.Id + '">Ver despacho</span>');
                    LG.unidades.addLayer(mk); items.push({ g: 'Unidades', t: u.Nombre, s: 'Despacho ' + d.Codigo, ico: 'truck', mk });
                }
            });
            D.CentrosDisposicion.forEach(cd => {
                const mk = L.marker([cd.Latitud, cd.Longitud], { icon: mkIcon('mk-center') }).bindPopup('<div class="pp-t">' + esc(cd.Nombre) + '</div><div class="pp-s">Centro de disposición final</div>');
                LG.centros.addLayer(mk); items.push({ g: 'Centros de disposición', t: cd.Nombre, s: cd.Latitud.toFixed(4) + ', ' + cd.Longitud.toFixed(4), ico: 'factory', mk });
            });
            D.Desbordes.forEach(x => {
                const c = byId(D.Clientes, x.ShapeOid); if (!c) return;
                const mk = L.marker([c.Latitud + 0.0012, c.Longitud - 0.0012], { icon: mkIcon('mk-alert'), zIndexOffset: 800 }).bindPopup('<div class="pp-t">Desborde</div><div class="pp-s">' + esc(c.NombreNegocio) + '</div><span class="pp-link" data-act="desborde" data-id="' + x.Id + '">Ver detalle</span>');
                LG.incidencias.addLayer(mk); items.push({ g: 'Incidencias', t: 'Desborde · ' + c.NombreNegocio, s: fmtDate(x.Fecha), ico: 'alerttri', mk });
            });
            D.UbicacionesContenedores.forEach(u => {
                const mk = L.marker([u.Latitud, u.Longitud], { icon: mkIcon('mk-ubi') }).bindPopup('<div class="pp-t">' + esc(u.Descripcion) + '</div><div class="pp-s">' + esc(u.TipoUbicacion) + '</div>');
                LG.ubicaciones.addLayer(mk); items.push({ g: 'Patio / Taller', t: u.Descripcion, s: u.TipoUbicacion, ico: 'home', mk });
            });
            Object.entries(LG).forEach(([k, g]) => { if (S.layers[k]) g.addTo(m); });
            const visible = Object.entries(S.layers).filter(([k, v]) => v).map(([k]) => k);
            const groups = { clientes: 'Clientes', contenedores: 'Contenedores', unidades: 'Unidades', centros: 'Centros de disposición', incidencias: 'Incidencias', ubicaciones: 'Patio / Taller' };
            $('#gis-list').innerHTML = items.filter(it => visible.some(k => {
                if (k === 'rutas') return false;

                || '<div class="empty">Active capas para ver elementos.</div>';
            S._gisMap = m; S._gisItems = items;
        }

        /* ══════════════════════════ REPORTES ══════════════════════════ */
        function renderReportes() {
            const vr = visitasRango();
            const kgPorUnidad = D.Unidades.map(u => {
                let kg = 0, vis = 0;
                despachosPeriodo().filter(d => d.UnidadId === u.Id).forEach(d => {
                    visitasDeDespacho(d.Id).forEach(v => {
                        if (!v.NoServicio) {
                            vis++;
                            v.ContenedoresVisitas.forEach(cv => {
                                const c = byId(D.Contenedores, cv.ContenedorId); const t = c ? byId(D.TiposContenedor, c.TipoContenedorId) : null;
                                if (t) kg += t.PesoPromedio || 0;
                            });
                        }
                    });
                });
                return { u, kg, vis };
            });
            const totalKg = kgPorUnidad.reduce((a, x) => a + x.kg, 0);
            const porCliente = D.Clientes.map(c => {
                const vs = vr.filter(v => v.ClienteId === c.Id);
                const ncont = vs.reduce((a, v) => a + v.ContenedoresVisitas.length, 0);
                const ultima = vs.length ? vs.map(v => v.FechaHoraInicio).sort().pop() : null;
                return { c, vs: vs.length, ncont, ultima };
            }).filter(x => x.vs > 0).sort((a, b) => b.vs - a.vs);
            $('#content').innerHTML =
                '<div class="page-head"><div><div class="page-title">' + I('chart', 20) + ' Centro de Reportes</div><div class="page-sub">Período: ' + fmtDate(S.range.ini) + ' — ' + fmtDate(S.range.fin) + ' · ' + vr.length + ' visitas</div></div>' +
                '<div class="spacer"></div><button class="btn soft" data-act="export">' + I('download', 15) + ' Exportar resumen</button></div>' +
                '<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">' +
                kpiCard('k-green', 'check', vr.filter(v => estadoVisita(v) === 'ok').length, 'Servicios exitosos', 'En el período', 'Visitas completadas con recolección realizada dentro del período.') +
                kpiCard('k-red', 'x', vr.filter(v => v.NoServicio).length, 'Servicios no realizados', 'En el período', 'Visitas donde no se pudo proporcionar el servicio dentro del período.') +
                kpiCard('k-blue', 'bin', vr.reduce((a, v) => a + v.ContenedoresVisitas.length, 0), 'Contenedores recolectados', 'En el período', 'Contenedores vaciados durante las visitas exitosas del período.') +
                kpiCard('k-purple', 'factory', (totalKg / 1000).toFixed(2) + ' t', 'Capacidad recolectada', 'Peso promedio estimado', 'Suma del peso promedio por tipo de contenedor de los contenedores recolectados en el período.') +
                '</div>' +
                '<div class="chart-grid" style="margin-top:16px">' +
                '<div class="card lift"><div class="card-h"><div class="card-t">' + I('chart', 15) + ' Visitas por día</div></div><div class="card-b"><canvas id="r-dia" height="190"></canvas></div></div>' +
                '<div class="card lift"><div class="card-h"><div class="card-t">' + I('truck', 15) + ' Capacidad recolectada por unidad (kg)</div></div><div class="card-b"><canvas id="r-kg" height="190"></canvas></div></div>' +
                '<div class="card lift"><div class="card-h"><div class="card-t">' + I('users', 15) + ' Operación por cliente (top 8)</div></div><div class="card-b"><canvas id="r-cli" height="190"></canvas></div></div>' +
                '<div class="card lift"><div class="card-h"><div class="card-t">' + I('leaf', 15) + ' Residuos por tipo (clientes)</div></div><div class="card-b"><canvas id="r-res" height="190"></canvas></div></div>' +
                '</div>' +
                '<div style="height:16px"></div>' +
                '<div class="card lift"><div class="card-h"><div class="card-t">' + I('users', 15) + ' Detalle de operación por cliente</div></div><div class="card-b">' +
                dataTable({
                    key: 'rcli', per: 8, rows: porCliente, cols: [
                        { k: 'c', l: 'Cliente', render: x => '<b>' + esc(x.c.NombreNegocio) + '</b><div class="muted" style="font-size:11px">' + esc(x.c.SubtipoCliente || '') + ' · ID #' + String(x.c.Id).padStart(4, '0') + '</div>' },
                        { k: 'vs', l: 'Visitas', sv: x => x.vs, render: x => '<b>' + x.vs + '</b>' },
                        { k: 'ncont', l: 'Contenedores recolectados', sv: x => x.ncont, render: x => x.ncont },
                        { k: 'ultima', l: 'Última visita', sv: x => x.ultima || '', render: x => fmtDT(x.ultima) },
                        { k: '_ns', l: 'Sin servicio', sv: x => x.vs.filter(v => v.NoServicio).length, render: x => { const n = x.vs.filter(v => v.NoServicio).length; return n ? badge(n + ' vez' + (n > 1 ? 'es' : ''), 'err') : badge('0', 'ok'); } },
                        { k: '_a', l: '', render: x => '<div class="td-act"><button class="mini-btn" data-act="cliente" data-id="' + x.c.Id + '">' + I('eye', 14) + '</button></div>' }]
                }) + '</div></div>' +
                '<div style="height:16px"></div>' +
                '<div class="card lift"><div class="card-h"><div class="card-t">' + I('clipboard', 15) + ' Inspecciones por unidad</div></div><div class="card-b">' +
                dataTable({
                    key: 'rinsp', per: 8, rows: D.Unidades, cols: [
                        { k: 'Codigo', l: 'Unidad', render: u => '<b>' + esc(u.Nombre) + '</b>' },
                        { k: '_t', l: 'Inspecciones', sv: u => D.InspeccionesUnidad.filter(i => i.UnidadId === u.Id && inRange(i.Fecha)).length, render: u => D.InspeccionesUnidad.filter(i => i.UnidadId === u.Id && inRange(i.Fecha)).length },
                        { k: '_ok', l: 'Verificados', sv: u => D.InspeccionesUnidad.filter(i => i.UnidadId === u.Id && inRange(i.Fecha) && i.Verificado).length, render: u => D.InspeccionesUnidad.filter(i => i.UnidadId === u.Id && inRange(i.Fecha) && i.Verificado).length },
                        {
                            k: '_p', l: 'Conformidad', sv: u => { const t = D.InspeccionesUnidad.filter(i => i.UnidadId === u.Id && inRange(i.Fecha)); return t.length ? t.filter(i => i.Verificado).length / t.length : 0; },
                            render: u => {
                                const t = D.InspeccionesUnidad.filter(i => i.UnidadId === u.Id && inRange(i.Fecha)); const p = t.length ? Math.round(t.filter(i => i.Verificado).length / t.length * 100) : 0;
                                return '<div class="row" style="min-width:150px"><div class="prog" style="flex:1">' + progBar([{ v: p, c: p === 100 ? '#2f9e63' : '#d9981e', t: '%' }, { v: 100 - p, c: 'var(--border)', t: '' }]) + '</div><b>' + p + '%</b></div>';
                            }
                        },
                        { k: '_a', l: '', render: u => '<div class="td-act"><button class="mini-btn" data-act="checklist" data-id="' + u.Id + '">' + I('clipboard', 14) + '</button></div>' }]
                }) + '</div></div>';
            const dias = []; for (let d = new Date(S.range.ini); d <= new Date(S.range.fin); d.setDate(d.getDate() + 1)) dias.push(d.toISOString().slice(0, 10));
            mkChart('r-dia', {
                type: 'line', data: {
                    labels: dias.map(x => fmtDate(x).slice(0, 6)),
                    datasets: [{ label: 'Visitas', data: dias.map(x => vr.filter(v => v.FechaHoraInicio.slice(0, 10) === x).length), borderColor: CPAL[0], backgroundColor: 'rgba(15,110,92,.14)', fill: true, tension: .35, pointRadius: 4, pointHoverRadius: 8 },
                    { label: 'Sin servicio', data: dias.map(x => vr.filter(v => v.FechaHoraInicio.slice(0, 10) === x && v.NoServicio).length), borderColor: CPAL[3], tension: .35, pointRadius: 4, pointHoverRadius: 8 }]
                },
                options: { plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 2 }, grid: { color: cssVar('--border') } }, x: { grid: { display: false } } } }
            });
            mkChart('r-kg', {
                type: 'bar', data: {
                    labels: kgPorUnidad.map(x => x.u.Codigo),
                    datasets: [{ label: 'Kg recolectados (est.)', data: kgPorUnidad.map(x => Math.round(x.kg)), backgroundColor: CPAL[1], borderRadius: 6, borderSkipped: false, hoverBackgroundColor: '#1d5ea3' }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: cssVar('--border') } }, x: { grid: { display: false } } } }
            });
            mkChart('r-cli', {
                type: 'bar', data: {
                    labels: porCliente.slice(0, 8).map(x => x.c.SubtipoCliente || x.c.NombreNegocio.slice(0, 14)),
                    datasets: [{ label: 'Visitas', data: porCliente.slice(0, 8).map(x => x.vs), backgroundColor: CPAL[0], borderRadius: 5, borderSkipped: false, hoverBackgroundColor: '#0a4d40' }]
                },
                options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: cssVar('--border') } }, y: { grid: { display: false } } } }
            });
            mkChart('r-res', {
                type: 'doughnut', data: {
                    labels: D.TiposResiduos.map(t => t.Nombre),
                    datasets: [{ data: D.TiposResiduos.map(t => D.Clientes.filter(c => c.TipoResiduoId === t.Id).length), backgroundColor: CPAL, borderWidth: 2, borderColor: cssVar('--surface'), hoverOffset: 12 }]
                },
                options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 11 } } }, cutout: '60%' }
            });
        }

        /* ══════════════════════════ BÚSQUEDA GLOBAL ══════════════════════════ */
        function globalSearch(q) {
            const box = $('#gs-list');
            if (!q || q.length < 2) { box.classList.remove('show'); return; }
            const Q = q.toUpperCase(); const res = [];
            D.Clientes.filter(c => (c.NombreNegocio + ' ' + c.SubtipoCliente).toUpperCase().includes(Q)).slice(0, 4).forEach(c => res.push({ k: 'Cliente', t: c.NombreNegocio, act: 'cliente', id: c.Id, ico: 'building' }));
            D.Contenedores.filter(c => (c.Codigo + ' ' + c.CodigoQR + ' ' + c.Descripcion).toUpperCase().includes(Q)).slice(0, 4).forEach(c => res.push({ k: 'Contenedor', t: c.Codigo + ' · ' + (c.Descripcion || ''), act: 'contenedor', id: c.Id, ico: 'bin' }));
            D.Unidades.filter(u => (u.Nombre + ' ' + u.Codigo + ' ' + u.Marca).toUpperCase().includes(Q)).slice(0, 3).forEach(u => res.push({ k: 'Unidad', t: u.Nombre, act: 'unidad', id: u.Id, ico: 'truck' }));
            D.Despachos.filter(d => (d.Codigo + ' ' + d.Nombre).toUpperCase().includes(Q)).slice(0, 3).forEach(d => res.push({ k: 'Despacho', t: d.Codigo + ' · ' + d.Nombre, act: 'despacho', id: d.Id, ico: 'route' }));
            box.innerHTML = res.length ? res.map(r => '<div class="gs-item" data-act="' + r.act + '" data-id="' + r.id + '"><span style="color:var(--primary)">' + I(r.ico, 15) + '</span><div><div style="font-weight:600;font-size:12.5px">' + esc(r.t) + '</div><div class="gs-k">' + r.k + '</div></div></div>').join('') : '<div class="gs-item">Sin resultados…</div>';
            box.classList.add('show');
        }
        document.addEventListener('click', e => {
            if (!e.target.closest('.tb-search')) { const b = $('#gs-list'); if (b) b.classList.remove('show'); }
        });

        /* ══════════════════════════ DELEGACIÓN DE EVENTOS ══════════════════════════ */
        document.addEventListener('click', e => {
            const t = e.target.closest('[data-act]'); if (!t) return;
            const a = t.dataset.act, id = t.dataset.id;
            switch (a) {
                case 'nav': go(id); break;
                case 'sb-toggle': document.body.classList.toggle('sb-collapsed'); document.body.classList.toggle('sb-open'); break;
                case 'theme': {
                    document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                    if (CURRENT_PROVIDER === 'claro') setProviderGlobal('oscuro');
                    else if (CURRENT_PROVIDER === 'oscuro') setProviderGlobal('claro');
                    go(S.view); break;
                }
                case 'close-modal': closeModalEl(t.closest('.modal-ov')); break;
                case 'layer': S.layers[id] = S.layers[id] ? 0 : 1; go(S.view); break;
                case 'acttab': S.tab.act = id; renderActList(); $$('#content .tabs .tab').forEach(b => b.classList.toggle('active', b.dataset.id === (S.tab.act || 'todo'))); break;
                case 'tab': S.tab[id] = t.dataset.id; go(S.view); break;
                case 'sort': {
                    const key = t.dataset.key, col = t.dataset.col; if (!col) break;
                    const st = S.sort[key] || { k: null, dir: 1 };
                    S.sort[key] = st.k === col ? { k: col, dir: -st.dir } : { k: col, dir: 1 };
                    if (S.updater) S.updater(); break;
                }
                case 'page': {
                    const p = parseInt(t.dataset.p); const key = t.dataset.key;
                    if (p >= 1) { S.page[key] = p; if (S.updater) S.updater(); } break;
                }
                /* ── Botones de la barra de filtros ── */
                case 'apply-filters': {
                    /* Lee los valores actuales de TODOS los controles de filtro de la vista
                       y los aplica antes de refrescar la tabla. */
                    $$('#content [data-fl^="' + id + ':"]').forEach(el => {
                        const parts = el.dataset.fl.split(':');
                        S.filters[id] = S.filters[id] || {};
                        S.filters[id][parts[1]] = el.value;
                    });
                    S.page[id] = 1;
                    if (S.updater) S.updater();
                    toast('Filtros aplicados.');
                    break;
                }
                case 'clear-filters': {
                    S.filters[id] = {}; S.page[id] = 1;
                    go(S.view);   // re-renderiza la vista con los filtros vacíos
                    toast('Filtros limpiados.');
                    break;
                }
                case 'cliente': modalCliente(byId(D.Clientes, +id) || D.Clientes[0]); break;
                case 'contenedor': modalContenedor(byId(D.Contenedores, +id)); break;
                case 'unidad': modalUnidad(byId(D.Unidades, +id)); break;
                case 'despacho': modalDespacho(byId(D.Despachos, +id)); break;
                case 'ruta': { const d = byId(D.Despachos, +id); if (d) modalRuta(d); break; }
                case 'visita': modalVisita(byId(D.ClientesVisitas, +id)); break;
                case 'desborde': modalDesborde(byId(D.Desbordes, +id)); break;
                case 'dano': modalDano(byId(D.DañosContenedor, +id)); break;
                case 'ubicacion': modalUbicacion(byId(D.UbicacionesContenedores, +id)); break;
                case 'checklist': modalChecklist(+id); break;
                case 'centro-map': {
                    const c = byId(D.CentrosDisposicion, +id);
                    openModal({ title: esc(c.Nombre), sub: 'Centro de disposición final', icon: 'factory', body: '<div id="map-cd" class="map-box sm" style="border-radius:12px;border:1px solid var(--border)"></div>' });
                    setTimeout(() => {
                        const m = makeMap('map-cd', { center: [c.Latitud, c.Longitud], zoom: 14 });
                        L.marker([c.Latitud, c.Longitud], { icon: mkIcon('mk-center') }).addTo(m).bindPopup('<div class="pp-t">' + esc(c.Nombre) + '</div><div class="pp-s">Centro de disposición</div>');
                    }, 260); break;
                }
                /* ── Visor de imágenes ── */
                case 'foto': {
                    const url = String(id);
                    let list = null, ctx = '';
                    const db = D.Desbordes.find(x => x.FotosUrls.includes(url));
                    if (db) { list = db.FotosUrls; ctx = 'Evidencia · Desborde en ' + esc((byId(D.Clientes, db.ShapeOid) || {}).NombreNegocio || ''); }
                    if (!list) {
                        const dn = D.DañosContenedor.find(x => x.FotosUrls.includes(url));
                        if (dn) { list = dn.FotosUrls; ctx = 'Evidencia · Daño de contenedor ' + esc((byId(D.Contenedores, dn.ContenedorId) || {}).Codigo || ''); }
                    }
                    if (!list) {
                        const vs = D.ClientesVisitas.find(x => x.FotoNoServicioUrl === url);
                        if (vs) { list = [url]; ctx = 'Evidencia · No servicio en ' + esc((byId(D.Clientes, vs.ClienteId) || {}).NombreNegocio || ''); }
                    }
                    list = list || [url];
                    openImageViewer(list, { title: ctx || 'Evidencia fotográfica', startAt: list.indexOf(url) });
                    break;
                }
                case 'fotos-desborde': {
                    const x = byId(D.Desbordes, +id); if (x) {
                        const c = byId(D.Clientes, x.ShapeOid) || {};
                        openImageViewer(x.FotosUrls, { title: 'Evidencia · Desborde', sub: esc(c.NombreNegocio || '') + ' · ' + fmtDate(x.Fecha) });
                    } break;
                }
                case 'fotos-dano': {
                    const x = byId(D.DañosContenedor, +id); if (x) {
                        const ct = byId(D.Contenedores, x.ContenedorId) || {};
                        openImageViewer(x.FotosUrls, { title: 'Evidencia · Daño de contenedor', sub: esc(ct.Codigo || '') + ' · ' + esc((byId(D['TiposDaño'], x.TipoDañoId) || {}).Nombre || '') });
                    } break;
                }
                case 'locate-cli': {
                    const c = byId(D.Clientes, +id); closeAllModals(); go('mapa');
                    setTimeout(() => { if (S._gisMap) { S._gisMap.flyTo([c.Latitud, c.Longitud], 16); } }, 500); break;
                }
                case 'locate-cont': {
                    const c = byId(D.Contenedores, +id); closeAllModals(); go('mapa');
                    setTimeout(() => { if (S._gisMap) { S._gisMap.flyTo([c.Latitud, c.Longitud], 16); } }, 500); break;
                }
                case 'focus': {
                    const it = (S._gisItems || []).find(x => x.g === t.dataset.g && x.t === t.dataset.t);
                    if (it && S._gisMap) { S._gisMap.flyTo(it.mk.getLatLng(), 16); it.mk.openPopup(); } break;
                }
                case 'export': toast('Exportación de resumen simulada (demostración).'); break;
            }
        });

        /* ── Filtros en vivo: inputs Y selects ──
           El bug anterior: la tabla se redibujaba con el conjunto de filas ya filtrado
           (closure con valores viejos). Ahora el filtrado se ejecuta DENTRO de
           S.updater, por lo que cualquier cambio se refleja inmediatamente.      */
        function onFilterControl(e) {
            const fl = e.target.dataset.fl; if (!fl) return;
            const [scope, field] = fl.split(':');
            S.filters[scope] = S.filters[scope] || {};
            S.filters[scope][field] = e.target.value;
            S.page[scope] = 1;
            if (S.updater) S.updater();
        }
        document.addEventListener('input', onFilterControl);
        /* Algunos navegadores solo disparan 'change' en los <select> */
        document.addEventListener('change', e => { if (e.target.tagName === 'SELECT') onFilterControl(e); });

        /* Enter dentro de un campo de filtro = aplicar */
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeTopModal();
            if (e.key === 'Enter' && e.target.dataset && e.target.dataset.fl) {
                e.preventDefault();
                onFilterControl(e);
                if (S.updater) S.updater();
            }
        });

        /* ══════════════════════════ INICIO ══════════════════════════ */
        document.title = (D.DatosGenerales.NombreEmpresa || 'ECOFLUX') + ' · Control de Recolección';
        renderSidebar(); renderTopbar(); go('dashboard');
    </script>
</body>
</html>
